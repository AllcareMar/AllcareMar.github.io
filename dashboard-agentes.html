<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Agent Dashboard — Allcare Mar Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --blue:#1a2fd4; --blue-dark:#0f1e9a; --blue-light:#e8ecff;
  --red:#e8001d; --red-dark:#b50016; --red-light:#fff0f2;
  --white:#ffffff; --gray-50:#faf8f5; --gray-100:#f3efe9; --gray-200:#e6e0d6;
  --gray-400:#8b8377; --gray-600:#544f47; --gray-800:#2b2723;
  --green:#00a86b; --warm-card:#fffdfa;
  --r:12px; --r-lg:20px; --r-xl:28px;
  --sh:0 4px 24px rgba(58,53,48,.08); --sh-lg:0 16px 56px rgba(58,53,48,.14);
  --t:.25s ease;
  --sidebar-w:270px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px;overflow-x:hidden}
body{font-family:'Open Sans',sans-serif;color:var(--gray-800);background:var(--gray-50);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Montserrat',sans-serif;line-height:1.2}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

/* ---------- Sidebar ---------- */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
  background:linear-gradient(180deg,var(--blue-dark),var(--blue));
  color:#fff;display:flex;flex-direction:column;z-index:100;
  box-shadow:var(--sh-lg);
}
.sidebar-brand{padding:30px 24px;border-bottom:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.sidebar-brand img{height:auto;width:100%;max-width:200px;filter:brightness(0) invert(1)}
.sidebar-user{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.15)}
.sidebar-user .hi{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;font-family:'Montserrat',sans-serif;font-weight:700;margin-bottom:6px}
.sidebar-user .agent-name{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15.5px;line-height:1.3;word-break:break-word}
.sidebar-user .agent-email{font-size:12px;opacity:.75;margin-top:4px;word-break:break-word}
.sidebar-nav{flex:1;padding:18px 14px;overflow-y:auto}
.nav-group{margin-bottom:4px}
.nav-group-toggle{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13.5px;color:#fff;opacity:.9;background:transparent;border:none;cursor:pointer;transition:var(--t)}
.nav-group-toggle i:first-child{width:18px;text-align:center;font-size:14px}
.nav-group-toggle .chev{margin-left:auto;font-size:11px;transition:transform .2s ease}
.nav-group-toggle:hover{background:rgba(255,255,255,.14);opacity:1}
.nav-group.open .nav-group-toggle{background:rgba(255,255,255,.1);opacity:1}
.nav-group.open .nav-group-toggle .chev{transform:rotate(180deg)}
.nav-sublist{display:none;flex-direction:column;padding:2px 6px 10px 40px}
.nav-group.open .nav-sublist{display:flex}
.nav-sub-link{display:block;padding:7px 8px;font-size:12px;color:#fff;opacity:.72;border-radius:6px;transition:var(--t);line-height:1.3}
.nav-sub-link:hover{opacity:1;background:rgba(255,255,255,.12)}
.nav-sub-link.disabled{opacity:.35;cursor:default}
.sidebar-foot{padding:18px 14px;border-top:1px solid rgba(255,255,255,.15)}
.lang-toggle{width:100%;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:9px 16px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer;letter-spacing:.03em;margin-bottom:10px}
.lang-toggle:hover{background:rgba(255,255,255,.26)}
.btn-logout{width:100%;background:var(--red);border:none;color:#fff;padding:12px 16px;border-radius:10px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:var(--t)}
.btn-logout:hover{background:var(--red-dark)}

/* ---------- Main content ---------- */
.main-content{margin-left:var(--sidebar-w);min-height:100vh;padding:40px 4vw 60px}
.dash-title{font-size:24px;font-weight:800;color:var(--blue-dark);margin-bottom:6px}
.dash-sub{font-size:13.5px;color:var(--gray-600);margin-bottom:36px}

.section-block{margin-bottom:48px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.section-head .si{width:40px;height:40px;border-radius:12px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.section-head.red .si{background:var(--red-light);color:var(--red)}
.section-head h2{font-size:18px;font-weight:800;color:var(--gray-800)}
.section-head p{font-size:12.5px;color:var(--gray-600);margin-top:2px}

.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.tool-card{aspect-ratio:1/1;background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r);padding:10px 8px;text-align:center;transition:var(--t);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tool-card:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:var(--sh-lg)}
.tool-card.disabled{cursor:default;opacity:.55}
.tool-card.disabled:hover{transform:none;box-shadow:none;border-color:var(--gray-200)}
.tool-card .ti-img{width:52px;height:52px;object-fit:contain}
.tool-card .ti-icon{width:52px;height:52px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:20px}
.tool-card .tn{font-family:'Montserrat',sans-serif;font-weight:800;font-size:10.5px;color:var(--gray-800);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.carrier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.carrier-card{aspect-ratio:1/1;background:var(--warm-card);border:1.5px solid var(--gray-200);border-radius:var(--r);padding:14px 10px;text-align:center;transition:var(--t);cursor:pointer;display:flex;align-items:center;justify-content:center}
.carrier-card:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:var(--sh-lg)}
.carrier-card .clogo{max-width:100%;width:auto;height:auto;max-height:56px;object-fit:contain}

.gsearch{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--gray-200);border-radius:24px;padding:6px 8px 6px 18px;max-width:460px;margin-bottom:36px;transition:var(--t)}
.gsearch:focus-within{border-color:var(--blue)}
.gsearch i.gicon{color:var(--gray-400);font-size:14px}
.gsearch input{flex:1;border:none;outline:none;font-size:13.5px;font-family:'Open Sans',sans-serif;color:var(--gray-800);background:transparent}
.gsearch button{background:var(--blue);color:#fff;border:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;flex-shrink:0;transition:var(--t)}
.gsearch button:hover{background:var(--blue-dark)}

footer.auth-mini-footer{padding:22px 20px;text-align:center;font-size:11.5px;color:var(--gray-400);background:#fff;border-top:1px solid var(--gray-200);margin-left:var(--sidebar-w)}
footer.auth-mini-footer a{color:var(--gray-600);font-weight:700;margin-left:6px}

/* ---------- Gate de Firma — Confidentiality Agreement ---------- */
#appShell.gated{filter:blur(6px);pointer-events:none;user-select:none;transition:filter .3s ease}
.sign-overlay{position:fixed;inset:0;background:rgba(43,39,35,.5);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}
.sign-overlay.show{display:flex}
.sign-modal{background:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-lg);padding:40px 36px;max-width:440px;width:100%;text-align:center;border:1px solid var(--gray-200)}
.sign-modal .shield-icon{width:64px;height:64px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px}
.sign-modal h2{font-size:19px;font-weight:800;color:var(--blue-dark);margin-bottom:10px}
.sign-modal p{font-size:13.5px;color:var(--gray-600);line-height:1.6;margin-bottom:24px}
.sign-modal .btn-sign{width:100%;background:var(--red);color:#fff;border:none;padding:14px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:14.5px;font-weight:800;cursor:pointer;transition:var(--t);display:flex;align-items:center;justify-content:center;gap:8px}
.sign-modal .btn-sign:hover{background:var(--red-dark);transform:translateY(-1px)}
.sign-modal .checking{font-size:12px;color:var(--gray-400);margin-top:14px}

@media(max-width:900px){
  :root{--sidebar-w:0px}
  .sidebar{position:relative;width:100%;height:auto;flex-direction:row;flex-wrap:wrap;padding:14px 5vw}
  .sidebar-brand,.sidebar-user{border-bottom:none;padding:8px 10px}
  .sidebar-nav{display:none}
  .sidebar-foot{border-top:none;display:flex;gap:10px;padding:8px 10px;flex:1;min-width:220px}
  .lang-toggle{margin-bottom:0;width:auto;flex:0 0 auto;padding:9px 14px}
  .btn-logout{width:auto;flex:0 0 auto}
  .main-content{margin-left:0;padding:32px 5vw 50px}
  footer.auth-mini-footer{margin-left:0}
}
@media(max-width:480px){
  .tool-grid,.carrier-grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .sidebar{flex-direction:column;align-items:stretch}
  .sidebar-foot{flex-direction:column}
}
</style>
</head>
<body>

<div id="appShell">
<aside class="sidebar">
  <div class="sidebar-brand">
    <img src="assets/img/logo-allcaremar.png" alt="Allcare Mar Agency"/>
  </div>
  <div class="sidebar-user">
    <div class="hi" id="welcome-label"></div>
    <div class="agent-name" id="agentName"></div>
    <div class="agent-email" id="agentMeta"></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-group" id="navGroupSupport">
      <button class="nav-group-toggle" type="button"><i class="fas fa-headset"></i> <span id="nav1"></span> <i class="fas fa-chevron-down chev"></i></button>
      <div class="nav-sublist" id="navSupportList"></div>
    </div>
    <div class="nav-group" id="navGroupLinks">
      <button class="nav-group-toggle" type="button"><i class="fas fa-link"></i> <span id="nav2"></span> <i class="fas fa-chevron-down chev"></i></button>
      <div class="nav-sublist" id="navLinksList"></div>
    </div>
    <div class="nav-group" id="navGroupCarriers">
      <button class="nav-group-toggle" type="button"><i class="fas fa-notes-medical"></i> <span id="nav3"></span> <i class="fas fa-chevron-down chev"></i></button>
      <div class="nav-sublist" id="navCarriersList"></div>
    </div>
  </nav>
  <div class="sidebar-foot">
    <button class="lang-toggle" id="langBtn"><span id="lang-label">ES</span></button>
    <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span id="logout-label"></span></button>
  </div>
</aside>

<main class="main-content">
  <div class="dash-title" id="dashTitle"></div>
  <div class="dash-sub" id="dashSub"></div>

  <form class="gsearch" id="gsearchForm" action="https://www.google.com/search" method="GET" target="_blank">
    <i class="fas fa-magnifying-glass gicon"></i>
    <input type="text" name="q" id="gsearchInput" autocomplete="off"/>
    <button type="submit" aria-label="Search Google"><i class="fas fa-arrow-right"></i></button>
  </form>

  <div class="section-block" id="agents-support">
    <div class="section-head">
      <div class="si"><i class="fas fa-headset"></i></div>
      <div>
        <h2 id="sec1Title"></h2>
      </div>
    </div>
    <div class="tool-grid" id="toolGridSupport"></div>
  </div>

  <div class="section-block" id="important-links">
    <div class="section-head">
      <div class="si"><i class="fas fa-link"></i></div>
      <div>
        <h2 id="sec2Title"></h2>
      </div>
    </div>
    <div class="tool-grid" id="toolGridLinks"></div>
  </div>

  <div class="section-block" id="medicare-portals">
    <div class="section-head red">
      <div class="si"><i class="fas fa-notes-medical"></i></div>
      <div>
        <h2 id="sec3Title"></h2>
      </div>
    </div>
    <div class="carrier-grid" id="carrierGrid"></div>
  </div>
</main>

<footer class="auth-mini-footer">
  <span id="mini-copy"></span><a href="privacy-security-policy.pdf" target="_blank" rel="noopener" id="mini-priv"></a>
</footer>
</div>

<div class="sign-overlay" id="signOverlay">
  <div class="sign-modal">
    <div class="shield-icon"><i class="fas fa-file-signature"></i></div>
    <h2 id="signTitle"></h2>
    <p id="signText"></p>
    <button class="btn-sign" id="signBtn"><i class="fas fa-pen-nib"></i> <span id="signBtnLabel"></span></button>
    <div class="checking" id="signChecking" style="display:none"></div>
  </div>
</div>

<script type="module">
import { isEmailAllowed } from "./google-config.js";

let curLang='en';

// Fuente única de las tarjetas — se usa para pintar tanto las tarjetas del
// panel principal como los links del menú lateral. Para agregar un acceso
// nuevo en el futuro, solo hay que agregar un objeto aquí (respetando el
// orden = orden en que aparece en ambos lugares). Tarjetas con `icon` (en vez
// de `img`) pintan un ícono de Font Awesome sobre un círculo de color — `bg`/
// `fg` son opcionales (si no se ponen, usan el azul de marca por default);
// `gradient` (solo Gemini) pinta un degradé en vez de un color sólido.
// `dynamic:'gmail'|'gemini'` arma el link en vivo con el email de la sesión
// activa (ver resolveHref) — no hace falta `href` en esos casos.
const AGENTS_SUPPORT = [
  { img:'assets/img/dashboard/daily-sales-report.webp', href:'https://server-bayonne.tailed39b8.ts.net:10000', en:'Daily Sales Report', es:'Reporte Diario de Ventas' },
  { img:'assets/img/dashboard/it-ticket.webp', href:'https://form.jotform.com/250776977609173', en:'IT Ticket', es:'Ticket de TI' },
  { img:'assets/img/dashboard/appointment-request.webp', comingSoon:true, en:'Appointment Request', es:'Solicitud de Cita' },
  { img:'assets/img/dashboard/agents-contact-list.webp', href:'https://drive.google.com/file/d/1WABdj0wHak0uXmtOo0DrNL4xvYpzwoAj/view?usp=drive_link', en:'Agents Contact List', es:'Directorio de Agentes' },
  { img:'assets/img/dashboard/resources.webp', href:'resources.html', en:'Resources', es:'Recursos' },
  { img:'assets/img/dashboard/whatsapp-web.webp', href:'https://web.whatsapp.com', en:'WhatsApp Web', es:'WhatsApp Web' },
  { img:'assets/img/dashboard/zoom.webp', href:'https://zoom.us/google', en:'Zoom App', es:'Zoom App' },
  { img:'assets/img/dashboard/gmail.webp', dynamic:'gmail', en:'Gmail', es:'Gmail' },
  { img:'assets/img/dashboard/gemini.webp', dynamic:'gemini', en:'Gemini', es:'Gemini' },
  { img:'assets/img/dashboard/medicaid-nj.webp', href:'https://njfamilycare.dhs.state.nj.us/', en:'Medicaid NJ', es:'Medicaid NJ' },
  { img:'assets/img/dashboard/conference-room.webp', href:'https://calendar.app.google/eYGK81gqAonoFSkY6', en:'Conference Room - 546 Office', es:'Sala de Conferencias - Oficina 546' },
  { img:'assets/img/dashboard/sprinter-van.webp', href:'https://calendar.app.google/tsgeZzUyYEaUzfTdA', en:'Sprinter / Van Reservations', es:'Reservas de Sprinter/Van' }
];

const IMPORTANT_LINKS = [
  { img:'assets/img/dashboard/berwick-insurance.webp', href:'https://berwickinsurance.com/login/', en:'Berwick Insurance', es:'Berwick Insurance' },
  { img:'assets/img/dashboard/integrity-connect.webp', href:'https://integrity.com/integrityconnect/', en:'Integrity Connect', es:'Integrity Connect' },
  { img:'assets/img/dashboard/integrity-connect-leads.webp', href:'https://integrity.com/leads/', en:'Integrity Connect Leads', es:'Integrity Connect Leads' },
  { img:'assets/img/dashboard/t65-app.webp', href:'https://t65.app/login.php?req=&No%20Cookie', en:'T65.app', es:'T65.app' },
  { img:'assets/img/dashboard/ssa-lis.webp', href:'https://secure.ssa.gov/i1020/start', en:'SSA - LIS', es:'SSA - LIS' },
  { icon:'fas fa-heart-pulse', bg:'#eaf1fb', fg:'#0b5ed7', href:'https://www.medicare.gov', en:'Medicare', es:'Medicare' },
  { icon:'fas fa-id-card', bg:'#eafbf6', fg:'#0f7a5c', href:'https://nipr.com', en:'NIPR', es:'NIPR' },
  { img:'assets/img/dashboard/sircon.webp', href:'https://www.sircon.com', en:'Sircon', es:'Sircon' },
  { img:'assets/img/dashboard/sircon.webp', href:'https://www.sircon.com/products/agencies/agencyLogin.jsp', en:'Sircon - Agencies', es:'Sircon - Agencies' }
];

// Misma idea para los portales de Medicare — agregar un carrier nuevo es un
// objeto más en este array (aparece automáticamente en la grilla y el menú).
const CARRIERS = [
  { img:'uhc-jarvis.webp', href:'https://www.uhcjarvis.com/', en:'UnitedHealthcare Jarvis', es:'UnitedHealthcare Jarvis' },
  { img:'mira.webp', href:'https://uhcmira.my.site.com/PartnerLoginPage?ec=302&startURL=%2Fs%2F', en:'Mira', es:'Mira' },
  { img:'aetna.webp', href:'https://www.aetna.com/producer_public/login.fcc', en:'Aetna', es:'Aetna' },
  { img:'humana.webp', href:'https://www.humana.com/agent/humana-agent-portal', en:'Humana', es:'Humana' },
  { img:'devoted-health.webp', href:'https://agent.devoted.com/', en:'Devoted Health', es:'Devoted Health' },
  { img:'jefferson-health.webp', href:'https://jeffersonhealthplans.com/medicare/broker-resources.html', en:'Jefferson Health Plans', es:'Jefferson Health Plans' },
  { img:'horizon.webp', href:'https://www.horizonblue.com/brokers/', en:'Horizon BCBSNJ', es:'Horizon BCBSNJ' },
  { img:'anthem.webp', href:'https://www.anthem.com/producer', en:'Anthem', es:'Anthem' },
  { img:'healthspring.webp', href:'https://healthspringforbrokers.zilverton.com/public/login', en:'HealthSpring', es:'HealthSpring' },
  { img:'emblemhealth.webp', href:'https://broker.emblemhealth.com/Broker/s/login/', en:'EmblemHealth', es:'EmblemHealth' },
  { img:'fidelis.webp', href:'https://www.fideliscare.org/brokers', en:'Fidelis Care', es:'Fidelis Care' },
  { img:'healthfirst.webp', href:'https://healthfirst.org/brokers', en:'Healthfirst', es:'Healthfirst' },
  { img:'molina-healthcare.webp', href:'https://molinaagentcenter.com/', en:'Molina Healthcare', es:'Molina Healthcare' },
  { img:'scanhealth.webp', href:'https://www.scanproducerportal.com/', en:'SCAN Health Plan', es:'SCAN Health Plan' },
  { img:'wellcare.webp', href:'https://www.wellcare.com/en/broker-resources/broker-resources', en:'Wellcare', es:'Wellcare' },
  { img:'wellpoint.webp', href:'https://www.wellpoint.com/broker', en:'Wellpoint', es:'Wellpoint' }
];

const I18N = {
  en:{ welcome:'Signed in as', logout:'Logout',
    dashTitle:'Agent Tools', dashSub:'Access your corporate resources and Medicare carrier portals below.',
    gsearchPlaceholder:'Search Google…',
    nav1:'Agents Support', nav2:'Important Links', nav3:'Medicare Portals',
    sec1Title:'Agents Support', sec2Title:'Important Links', sec3Title:'Medicare Portals',
    comingSoon:'Coming soon',
    signTitle:'Action Required', signText:'You must sign the Confidentiality Agreement before accessing the Agent Portal. This is a one-time step.',
    signBtnLabel:'Sign Confidentiality Agreement', signChecking:'Verifying signature status…' },
  es:{ welcome:'Sesión iniciada como', logout:'Cerrar Sesión',
    dashTitle:'Herramientas del Agente', dashSub:'Accede a tus recursos corporativos y a los portales de las aseguradoras de Medicare.',
    gsearchPlaceholder:'Buscar en Google…',
    nav1:'Soporte de Agentes', nav2:'Enlaces Importantes', nav3:'Portales de Medicare',
    sec1Title:'Soporte de Agentes', sec2Title:'Enlaces Importantes', sec3Title:'Portales de Medicare',
    comingSoon:'Próximamente',
    signTitle:'Acción Requerida', signText:'Debes firmar el Acuerdo de Confidencialidad antes de acceder al Portal de Agentes. Este paso se hace una sola vez.',
    signBtnLabel:'Firmar Acuerdo de Confidencialidad', signChecking:'Verificando estado de firma…' }
};

function label(x){ return curLang==='es' ? x.es : x.en; }

// El email de la sesión activa — se llena en guard() apenas se valida el
// login, y se usa para armar los links de Gmail/Gemini en vivo (ver
// resolveHref) para que abran directo con la cuenta de Workspace del agente.
let AGENT_EMAIL = '';
function resolveHref(x){
  if(x.dynamic === 'gmail') return 'https://mail.google.com/mail/?authuser=' + encodeURIComponent(AGENT_EMAIL);
  if(x.dynamic === 'gemini') return 'https://gemini.google.com/app?authuser=' + encodeURIComponent(AGENT_EMAIL);
  return x.href;
}

function iconStyleOf(x){
  if(x.gradient) return 'background:'+x.gradient+';color:#fff';
  return 'background:'+(x.bg||'var(--blue-light)')+';color:'+(x.fg||'var(--blue)');
}

// Función genérica de render — la usan tanto Agents Support como Important
// Links (mismo formato de tarjeta, distinta lista de datos y distintos ids
// de destino en el DOM).
function renderToolGroup(list, gridId, navId){
  const t = I18N[curLang];
  document.getElementById(gridId).innerHTML = list.map(x=>{
    const body = (x.icon
      ? '<div class="ti-icon" style="'+iconStyleOf(x)+'"><i class="'+x.icon+'"></i></div>'
      : '<img class="ti-img" src="'+x.img+'" alt="'+label(x)+'" loading="lazy"/>')
      + '<div class="tn">'+label(x)+'</div>';
    return x.comingSoon
      ? '<span class="tool-card disabled" title="'+t.comingSoon+'">'+body+'</span>'
      : '<a class="tool-card" href="'+resolveHref(x)+'" target="_blank" rel="noopener">'+body+'</a>';
  }).join('');
  document.getElementById(navId).innerHTML = list.map(x=>
    x.comingSoon
      ? '<span class="nav-sub-link disabled" title="'+t.comingSoon+'">'+label(x)+'</span>'
      : '<a class="nav-sub-link" href="'+resolveHref(x)+'" target="_blank" rel="noopener">'+label(x)+'</a>'
  ).join('');
}

document.getElementById('logoutBtn').addEventListener('click', function(){
  localStorage.removeItem('acm_gsession');
  // acm_signed NO se borra: haber firmado no depende de la sesión de login,
  // es permanente. Borrarlo forzaría a re-verificar contra Jotform (con el
  // "flash" del gate) cada vez que alguien vuelve a entrar tras cerrar sesión.
  if(typeof google !== 'undefined' && google.accounts){ try{ google.accounts.id.disableAutoSelect(); }catch(e){} }
  window.location.href='index.html';
});

// Mismo Web App que ya usa el formulario "Tell Us About You" (Codigo.gs) —
// se le agregó la acción checkSignature (doGet) sin tocar el doPost existente.
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxax1NwoYg81Tp2yQjUo-gYUOE187xAIZU0bGnqmGoi9UHlEPgm7JOiUYrDvZL5dAE/exec";

// ---- Gate de Firma — Confidentiality Agreement ----
// Fuente de verdad: siempre Jotform (vía checkSignature). acm_signed en
// localStorage es solo un cache para no re-consultar una vez confirmado.

// Cuentas de la agencia exentas del gate (no son agentes que deban firmar
// el Confidentiality Agreement). EXEMPT_GATE_ACTIVE queda en false mientras
// se está probando el flujo completo (para poder testear como jcabreja@) —
// ⚠️ CAMBIAR A true antes de subir esta versión a GitHub / producción.
const EXEMPT_EMAILS = ['info@allcaremar.com', 'jcabreja@allcaremar.com'];
const EXEMPT_GATE_ACTIVE = false;

function getCachedSigned(email){
  try{
    const raw = localStorage.getItem('acm_signed');
    if(!raw) return false;
    const data = JSON.parse(raw);
    return !!(data && data.email === email && data.signed === true);
  }catch(e){ return false; }
}
function cacheSigned(email, signedAt){
  localStorage.setItem('acm_signed', JSON.stringify({ email, signed:true, signedAt: signedAt || null }));
}
// showBlur: estado neutro de "verificando" (solo difumina, sin mostrar el
// modal todavía) — evita el flash de ver el botón de firma aparecer y
// desaparecer para alguien que en realidad ya había firmado.
function showBlur(){
  document.getElementById('appShell').classList.add('gated');
}
function revealSignModal(){
  document.getElementById('signOverlay').classList.add('show');
}
function hideGate(){
  document.getElementById('appShell').classList.remove('gated');
  document.getElementById('signOverlay').classList.remove('show');
}
async function checkSignatureRemote(email, force){
  let url = GOOGLE_SCRIPT_URL + '?action=checkSignature&email=' + encodeURIComponent(email);
  if(force) url += '&force=1';
  const res = await fetch(url);
  return res.json();
}

async function runSignatureGate(session){
  const email = session.email;

  if(EXEMPT_GATE_ACTIVE && EXEMPT_EMAILS.includes(email.toLowerCase())){ hideGate(); return; }
  if(getCachedSigned(email)){ hideGate(); return; }

  // No sabemos todavía si ya firmó (sin cache local — primera vez, otro
  // dispositivo, o el navegador se limpió) — solo difuminamos mientras se
  // verifica, sin mostrar el botón de firma hasta confirmar que hace falta.
  showBlur();
  document.getElementById('signBtn').onclick = function(){
    window.location.href = 'firma-requerida.html';
  };

  // Si venimos de vuelta de Jotform (?justSigned=1), reintentamos unas veces
  // por si el submission todavía no terminó de indexarse del lado de Jotform.
  const params = new URLSearchParams(window.location.search);
  const justSigned = params.get('justSigned') === '1';
  const checkingEl = document.getElementById('signChecking');
  const maxTries = justSigned ? 4 : 1;
  const delayMs = 2500;

  for(let i=0; i<maxTries; i++){
    if(justSigned){ revealSignModal(); checkingEl.style.display = 'block'; }
    try{
      const data = await checkSignatureRemote(email, justSigned);
      if(data && data.signed){
        cacheSigned(email, data.signedAt);
        hideGate();
        if(justSigned){
          params.delete('justSigned');
          const clean = window.location.pathname + (params.toString() ? '?'+params.toString() : '');
          window.history.replaceState({}, '', clean);
        }
        return;
      }
    }catch(e){ /* deja el gate visible; se reintenta en la próxima carga */ }
    if(i < maxTries - 1) await new Promise(r=>setTimeout(r, delayMs));
  }
  // Confirmado (o se agotaron los reintentos post-firma): recién ahora se
  // revela el modal con el botón — no antes, para no mostrarlo de más.
  revealSignModal();
  if(justSigned) checkingEl.style.display = 'none';
}

function guard(){
  const raw = localStorage.getItem('acm_gsession');
  if(!raw){ window.location.href='login.html'; return null; }
  let session;
  try{ session = JSON.parse(raw); }catch(e){ localStorage.removeItem('acm_gsession'); window.location.href='login.html'; return null; }

  if(!isEmailAllowed(session.email) || !session.localExp || Date.now() > session.localExp){
    localStorage.removeItem('acm_gsession');
    window.location.href='login.html';
    return null;
  }
  document.getElementById('agentName').textContent = session.name || session.email;
  document.getElementById('agentMeta').textContent = session.email;
  AGENT_EMAIL = session.email;
  return session;
}

const __session = guard();
if(__session) runSignatureGate(__session);
applyLang();
</script>
