<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Events — Administration — Allcare Mar Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --blue:#1a2fd4; --blue-dark:#0f1e9a; --blue-light:#e8ecff;
  --red:#e8001d; --red-dark:#b50016; --red-light:#fff0f2;
  --gray-50:#faf8f5; --gray-100:#f3efe9; --gray-200:#e6e0d6;
  --gray-400:#8b8377; --gray-600:#544f47; --gray-800:#2b2723;
  --green:#00a86b;
  --r:12px; --r-lg:20px;
  --sh:0 4px 24px rgba(58,53,48,.08); --sh-lg:0 16px 56px rgba(58,53,48,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;color:var(--gray-800);background:var(--gray-50);min-height:100vh}
h1,h2,h3{font-family:'Montserrat',sans-serif;line-height:1.2}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

.ev-header{display:flex;align-items:center;justify-content:space-between;padding:18px 5vw;background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;flex-wrap:wrap;gap:12px}
.ev-header .brand{display:flex;align-items:center;gap:14px}
.ev-header .brand img{height:30px;filter:brightness(0) invert(1)}
.ev-header h1{font-size:16px;font-weight:800}
.ev-header .sub{font-size:11.5px;opacity:.8}
.ev-header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lang-toggle{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:11.5px;cursor:pointer}
.btn-logout{background:var(--red);border:none;color:#fff;padding:9px 16px;border-radius:20px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer}

.ev-wrap{max-width:960px;margin:0 auto;padding:32px 5vw 80px}
.ev-banner{background:#fff3cd;border:1px solid #ffe08a;color:#7a5b00;font-size:13px;padding:14px 18px;border-radius:10px;margin-bottom:22px;line-height:1.6;display:none}
.ev-banner.show{display:block}
.ev-banner.denied{background:var(--red-light);color:var(--red-dark);border-color:#ffd0d6}
.ev-section{margin-bottom:40px}
.ev-h2{font-size:17px;font-weight:800;color:var(--blue-dark);margin-bottom:4px}
.ev-hint{font-size:12.5px;color:var(--gray-600);margin-bottom:16px}

.event-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh)}
.event-card h3{font-size:15px;color:var(--blue-dark);margin-bottom:6px}
.event-meta{font-size:12.5px;color:var(--gray-600);line-height:1.8}
.event-meta a{color:var(--blue)}
.event-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:10px}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;cursor:pointer}
.btn-primary:hover{background:var(--blue-dark)}
.btn-approve{background:var(--green);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:800;cursor:pointer}
.btn-reject{background:var(--red);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:800;cursor:pointer}
.btn-sec{background:#fff;border:1.5px solid var(--blue);color:var(--blue-dark);padding:9px 16px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer}

.frm-lbl{display:block;font-size:12.5px;font-weight:700;color:var(--gray-800);margin-bottom:6px;font-family:'Montserrat',sans-serif}
select,input[type=text],input[type=date],input[type=datetime-local],input[type=number],textarea{width:100%;padding:11px 13px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:14px;font-family:'Open Sans',sans-serif;background:#fff;color:var(--gray-800)}
.form-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{margin-bottom:12px}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;font-family:'Montserrat',sans-serif}
.badge-open{background:var(--blue-light);color:var(--blue-dark)}
.badge-pending{background:#fff3cd;color:#7a5b00}
.badge-full{background:#ffe6cc;color:#8a4a00}
.badge-closed{background:#e6f8f0;color:#046a45}
.badge-canceled{background:var(--red-light);color:var(--red-dark)}
.reg-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-200);font-size:13px}
.reg-row label{display:flex;align-items:center;gap:8px;flex:1}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="ev-header">
  <div class="brand"><img src="../assets/img/logo-allcaremar.png" alt="Allcare Mar"/>
    <div><h1 id="hTitle"></h1><div class="sub" id="hSub"></div></div></div>
  <div class="ev-header-right">
    <button class="lang-toggle" id="langBtn">ES</button>
    <button class="btn-logout" id="logoutBtn"></button>
  </div>
</header>

<main class="ev-wrap">
  <div class="ev-banner" id="apiBanner"></div>
  <div class="ev-banner denied" id="deniedBanner"></div>

  <div id="adminContent" style="display:none">
    <section class="ev-section">
      <div class="ev-h2" id="hPending"></div>
      <p class="ev-hint" id="hintPending"></p>
      <div id="pendingEvents"></div>
    </section>

    <section class="ev-section">
      <div class="ev-h2" id="hOpen"></div>
      <p class="ev-hint" id="hintOpen"></p>
      <div id="openEvents"></div>
    </section>

    <section class="ev-section">
      <div class="ev-h2" id="hCreate"></div>
      <div class="form-card">
        <div class="grid2">
          <div class="field"><label class="frm-lbl" id="lblTitle"></label><input type="text" id="fTitle"></div>
          <div class="field"><label class="frm-lbl" id="lblOrganizer"></label><input type="text" id="fOrganizer"></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="frm-lbl" id="lblAddress"></label><input type="text" id="fAddress"></div>
          <div class="field"><label class="frm-lbl" id="lblZip"></label><input type="text" id="fZip"></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="frm-lbl" id="lblDate"></label><input type="date" id="fDate"></div>
          <div class="field"><label class="frm-lbl" id="lblTime"></label><input type="text" id="fTime" placeholder="10:00 AM - 4:00 PM"></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="frm-lbl" id="lblDeadline"></label><input type="datetime-local" id="fDeadline"></div>
          <div class="field"><label class="frm-lbl" id="lblMaxSlots"></label><input type="number" id="fMaxSlots" value="4" min="1" max="10"></div>
        </div>
        <div class="field"><label class="frm-lbl" id="lblNotes"></label><textarea id="fNotes"></textarea></div>
        <button class="btn-primary" id="createBtn"></button>
        <div id="createSuccess" style="display:none;margin-top:12px;color:var(--green);font-weight:700;font-size:13.5px"></div>
      </div>
    </section>

    <section class="ev-section">
      <div class="ev-h2" id="hHistory"></div>
      <div id="historyEvents"></div>
    </section>
  </div>
</main>

<script type="module">
import { API_BASE, apiReady } from "./assets/js/api-config.js";
import { guard, apiJson } from "./assets/js/agent-api-session.js";

const session = guard();
let curLang = 'en';

const I18N = {
en:{
  title:"Events — Administration", sub:"Allcare Mar Agency", logout:"Sign out",
  apiPending:"This tool is being connected to the server — check back soon.",
  denied:"This section is restricted to the Events administrators.",
  hPending:"Suggested events awaiting approval", hintPending:"Review before it appears in the agents' open events list.",
  noPending:"Nothing pending right now.",
  approve:"Approve", reject:"Reject",
  hOpen:"Open events — review registrations", hintOpen:"Pick who actually attends, then finalize to send confirmation emails.",
  noOpen:"No open events right now.",
  registered:"Registered on", finalize:"Finalize attendees", cancel:"Cancel event",
  statusFull:"Full", statusOpen:"Open",
  hCreate:"Create a new event", lblTitle:"Event name", lblOrganizer:"Organizer", lblAddress:"Address", lblZip:"Zip code",
  lblDate:"Event date", lblTime:"Time (optional)", lblDeadline:"Registration deadline", lblMaxSlots:"Max agents",
  lblNotes:"Notes (optional)", createBtn:"Create event", createSuccess:"✓ Event created and open for registration.",
  hHistory:"Closed / canceled events", noHistory:"Nothing here yet.",
  statusClosedConfirmed:"Confirmed", statusClosedIncomplete:"Closed — incomplete", statusCanceled:"Canceled",
},
es:{
  title:"Eventos — Administración", sub:"Allcare Mar Agency", logout:"Cerrar sesión",
  apiPending:"Esta herramienta se está conectando al servidor — vuelve pronto.",
  denied:"Esta sección está restringida a los administradores de Eventos.",
  hPending:"Eventos sugeridos pendientes de aprobación", hintPending:"Revísalo antes de que aparezca en el listado de eventos abiertos de los agentes.",
  noPending:"No hay nada pendiente por ahora.",
  approve:"Aprobar", reject:"Rechazar",
  hOpen:"Eventos abiertos — revisar inscripciones", hintOpen:"Elige quién asiste realmente y finaliza para mandar los emails de confirmación.",
  noOpen:"No hay eventos abiertos por ahora.",
  registered:"Inscrito el", finalize:"Finalizar asistentes", cancel:"Cancelar evento",
  statusFull:"Lleno", statusOpen:"Abierto",
  hCreate:"Crear un evento nuevo", lblTitle:"Nombre del evento", lblOrganizer:"Organizador", lblAddress:"Dirección", lblZip:"Código postal",
  lblDate:"Fecha del evento", lblTime:"Horario (opcional)", lblDeadline:"Fecha límite de inscripción", lblMaxSlots:"Máximo de agentes",
  lblNotes:"Notas (opcional)", createBtn:"Crear evento", createSuccess:"✓ Evento creado y abierto para inscripción.",
  hHistory:"Eventos cerrados / cancelados", noHistory:"Todavía no hay nada aquí.",
  statusClosedConfirmed:"Confirmado", statusClosedIncomplete:"Cerrado — incompleto", statusCanceled:"Cancelado",
}
};
function t(k){ return I18N[curLang][k]; }

function applyStaticText(){
  document.getElementById('hTitle').textContent = t('title');
  document.getElementById('hSub').textContent = t('sub');
  document.getElementById('logoutBtn').textContent = t('logout');
  document.getElementById('hPending').textContent = t('hPending');
  document.getElementById('hintPending').textContent = t('hintPending');
  document.getElementById('hOpen').textContent = t('hOpen');
  document.getElementById('hintOpen').textContent = t('hintOpen');
  document.getElementById('hCreate').textContent = t('hCreate');
  document.getElementById('lblTitle').textContent = t('lblTitle');
  document.getElementById('lblOrganizer').textContent = t('lblOrganizer');
  document.getElementById('lblAddress').textContent = t('lblAddress');
  document.getElementById('lblZip').textContent = t('lblZip');
  document.getElementById('lblDate').textContent = t('lblDate');
  document.getElementById('lblTime').textContent = t('lblTime');
  document.getElementById('lblDeadline').textContent = t('lblDeadline');
  document.getElementById('lblMaxSlots').textContent = t('lblMaxSlots');
  document.getElementById('lblNotes').textContent = t('lblNotes');
  document.getElementById('createBtn').textContent = t('createBtn');
  document.getElementById('hHistory').textContent = t('hHistory');
}

document.getElementById('langBtn').addEventListener('click', ()=>{
  curLang = curLang === 'en' ? 'es' : 'en';
  document.getElementById('langBtn').textContent = curLang === 'en' ? 'ES' : 'EN';
  applyStaticText();
  loadAll();
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem('acm_gsession');
  if (typeof google !== 'undefined' && google.accounts) { try { google.accounts.id.disableAutoSelect(); } catch(e){} }
  window.location.href = '../login.html';
});

async function loadPending(){
  const events = await apiJson(API_BASE, '/events/admin/all?status=pending_approval');
  const wrap = document.getElementById('pendingEvents');
  if (!events.length) { wrap.innerHTML = `<p class="ev-hint">${t('noPending')}</p>`; return; }
  wrap.innerHTML = events.map(e => `
    <div class="event-card">
      <h3>${e.title} <span class="badge badge-pending">${curLang==='en'?'Suggested by':'Sugerido por'} ${e.suggested_by_name || e.suggested_by_email}</span></h3>
      <div class="event-meta">
        ${e.organizer} · ${e.event_date}${e.event_time ? ' · ' + e.event_time : ''}<br>
        ${e.address}, ${e.zipcode}<br>
        ${e.notes ? e.notes + '<br>' : ''}
      </div>
      <div class="event-foot">
        <div></div>
        <div style="display:flex;gap:8px">
          <button class="btn-approve" data-approve="${e.id}">${t('approve')}</button>
          <button class="btn-reject" data-reject="${e.id}">${t('reject')}</button>
        </div>
      </div>
    </div>`).join('');
  wrap.querySelectorAll('[data-approve]').forEach(btn=>btn.addEventListener('click', async ()=>{
    await apiJson(API_BASE, `/events/admin/${btn.dataset.approve}/approve-suggestion`, {method:'POST'}); loadAll();
  }));
  wrap.querySelectorAll('[data-reject]').forEach(btn=>btn.addEventListener('click', async ()=>{
    await apiJson(API_BASE, `/events/admin/${btn.dataset.reject}/reject-suggestion`, {method:'POST'}); loadAll();
  }));
}

async function loadOpen(){
  const events = await apiJson(API_BASE, '/events/admin/all?status=open');
  const full = await apiJson(API_BASE, '/events/admin/all?status=full');
  const wrap = document.getElementById('openEvents');
  const all = [...full, ...events];
  if (!all.length) { wrap.innerHTML = `<p class="ev-hint">${t('noOpen')}</p>`; return; }
  const blocks = await Promise.all(all.map(async e => {
    const regs = await apiJson(API_BASE, `/events/admin/${e.id}/registrations`);
    return { e, regs };
  }));
  wrap.innerHTML = blocks.map(({e, regs}) => `
    <div class="event-card">
      <h3>${e.title} <span class="badge ${e.status==='full'?'badge-full':'badge-open'}">${e.status==='full'?t('statusFull'):t('statusOpen')}</span></h3>
      <div class="event-meta">
        ${e.organizer} · ${e.event_date}${e.event_time ? ' · ' + e.event_time : ''} · ${e.address}, ${e.zipcode}<br>
        ${e.slots_taken}/${e.max_slots}
      </div>
      <div style="margin-top:10px">
        ${regs.map(r => `<div class="reg-row"><label><input type="checkbox" class="attendCheck" data-event="${e.id}" value="${r.agent_email}" checked> ${r.agent_name} (${r.agent_email})</label><span class="ev-hint" style="margin:0">${t('registered')} ${new Date(r.registered_at).toLocaleString()}</span></div>`).join('')}
      </div>
      <div class="event-foot">
        <button class="btn-sec" data-cancel="${e.id}">${t('cancel')}</button>
        <button class="btn-primary" data-finalize="${e.id}">${t('finalize')}</button>
      </div>
    </div>`).join('');
  wrap.querySelectorAll('[data-finalize]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const eventId = btn.dataset.finalize;
    const emails = Array.from(wrap.querySelectorAll(`.attendCheck[data-event="${eventId}"]:checked`)).map(c=>c.value);
    await apiJson(API_BASE, `/events/admin/${eventId}/finalize`, {method:'POST', body: JSON.stringify({approved_emails: emails})});
    loadAll();
  }));
  wrap.querySelectorAll('[data-cancel]').forEach(btn=>btn.addEventListener('click', async ()=>{
    await apiJson(API_BASE, `/events/admin/${btn.dataset.cancel}/cancel`, {method:'POST'}); loadAll();
  }));
}

async function loadHistory(){
  const statuses = ['closed_confirmed','closed_incomplete','canceled'];
  const lists = await Promise.all(statuses.map(s => apiJson(API_BASE, `/events/admin/all?status=${s}`)));
  const all = lists.flat().sort((a,b) => new Date(b.event_date) - new Date(a.event_date));
  const badgeMap = { closed_confirmed:['badge-closed','statusClosedConfirmed'], closed_incomplete:['badge-full','statusClosedIncomplete'], canceled:['badge-canceled','statusCanceled'] };
  const wrap = document.getElementById('historyEvents');
  if (!all.length) { wrap.innerHTML = `<p class="ev-hint">${t('noHistory')}</p>`; return; }
  wrap.innerHTML = all.map(e => {
    const [cls, key] = badgeMap[e.status];
    return `<div class="event-card"><h3>${e.title} <span class="badge ${cls}">${t(key)}</span></h3>
      <div class="event-meta">${e.organizer} · ${e.event_date} · ${e.address}, ${e.zipcode}</div></div>`;
  }).join('');
}

document.getElementById('createBtn').addEventListener('click', async ()=>{
  const body = {
    title: document.getElementById('fTitle').value,
    organizer: document.getElementById('fOrganizer').value,
    address: document.getElementById('fAddress').value,
    zipcode: document.getElementById('fZip').value,
    event_date: document.getElementById('fDate').value,
    event_time: document.getElementById('fTime').value || null,
    registration_deadline: document.getElementById('fDeadline').value,
    max_slots: parseInt(document.getElementById('fMaxSlots').value || '4', 10),
    notes: document.getElementById('fNotes').value || null,
  };
  if (!body.title || !body.organizer || !body.address || !body.zipcode || !body.event_date || !body.registration_deadline) {
    alert(curLang==='en' ? 'Please complete all required fields.' : 'Completa todos los campos requeridos.');
    return;
  }
  try {
    await apiJson(API_BASE, '/events/admin', {method:'POST', body: JSON.stringify(body)});
    document.getElementById('createSuccess').style.display = 'block';
    document.getElementById('createSuccess').textContent = t('createSuccess');
    ['fTitle','fOrganizer','fAddress','fZip','fDate','fTime','fDeadline','fNotes'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fMaxSlots').value = 4;
    loadAll();
  } catch(e) { alert(e.message); }
});

async function loadAll(){
  await loadPending();
  await loadOpen();
  await loadHistory();
}

async function init(){
  if (!session) return;
  applyStaticText();
  if (!apiReady()) {
    document.getElementById('apiBanner').classList.add('show');
    document.getElementById('apiBanner').textContent = t('apiPending');
    return;
  }
  try {
    await loadAll();
    document.getElementById('adminContent').style.display = 'block';
  } catch(e) {
    document.getElementById('deniedBanner').classList.add('show');
    document.getElementById('deniedBanner').textContent = t('denied');
  }
}
init();
</script>
</body>
</html>
