<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Events — Allcare Mar Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --blue:#1a2fd4; --blue-dark:#0f1e9a; --blue-light:#e8ecff;
  --red:#e8001d; --red-dark:#b50016; --red-light:#fff0f2;
  --gray-50:#faf8f5; --gray-100:#f3efe9; --gray-200:#e6e0d6;
  --gray-400:#8b8377; --gray-600:#544f47; --gray-800:#2b2723;
  --green:#00a86b;
  --r:12px; --r-lg:20px;
  --sh:0 4px 24px rgba(58,53,48,.08); --sh-lg:0 16px 56px rgba(58,53,48,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;color:var(--gray-800);background:var(--gray-50);min-height:100vh}
h1,h2,h3{font-family:'Montserrat',sans-serif;line-height:1.2}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

.ev-header{display:flex;align-items:center;justify-content:space-between;padding:18px 5vw;background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;flex-wrap:wrap;gap:12px}
.ev-header .brand{display:flex;align-items:center;gap:14px}
.ev-header .brand img{height:30px;filter:brightness(0) invert(1)}
.ev-header h1{font-size:16px;font-weight:800}
.ev-header .sub{font-size:11.5px;opacity:.8}
.ev-header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lang-toggle{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:11.5px;cursor:pointer}
.btn-logout{background:var(--red);border:none;color:#fff;padding:9px 16px;border-radius:20px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer}

.ev-wrap{max-width:960px;margin:0 auto;padding:32px 5vw 80px}
.ev-banner{background:#fff3cd;border:1px solid #ffe08a;color:#7a5b00;font-size:13px;padding:14px 18px;border-radius:10px;margin-bottom:22px;line-height:1.6;display:none}
.ev-banner.show{display:block}
.ev-banner.denied{background:var(--red-light);color:var(--red-dark);border-color:#ffd0d6}

.ev-tabs{display:flex;gap:4px;margin-bottom:0;flex-wrap:wrap}
.ev-tab{padding:11px 18px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;border:1.5px solid var(--gray-200);border-bottom:none;border-radius:12px 12px 0 0;cursor:pointer;background:var(--gray-100);color:var(--gray-600)}
.ev-tab.on{background:#fff;color:var(--blue-dark);border-color:var(--gray-200)}
.ev-panel{border:1.5px solid var(--gray-200);border-radius:0 var(--r-lg) var(--r-lg) var(--r-lg);padding:24px;background:#fff;box-shadow:var(--sh)}
.ev-panel[hidden]{display:none}

.ev-section{margin-bottom:36px}
.ev-section:last-child{margin-bottom:0}
.ev-h2{font-size:17px;font-weight:800;color:var(--blue-dark);margin-bottom:4px}
.ev-hint{font-size:12.5px;color:var(--gray-600);margin-bottom:16px}

.event-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh)}
.event-card h3{font-size:15px;color:var(--blue-dark);margin-bottom:6px}
.event-meta{font-size:12.5px;color:var(--gray-600);line-height:1.8}
.event-meta a{color:var(--blue)}
.event-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:10px}
.slots-pill{font-family:'Montserrat',sans-serif;font-weight:800;font-size:11.5px;padding:5px 12px;border-radius:20px;background:var(--blue-light);color:var(--blue-dark)}
.slots-pill.full{background:var(--red-light);color:var(--red-dark)}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;cursor:pointer}
.btn-primary:hover{background:var(--blue-dark)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sec{background:#fff;border:1.5px solid var(--blue);color:var(--blue-dark);padding:9px 16px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer}
.btn-approve{background:var(--green);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:800;cursor:pointer}
.btn-reject{background:var(--red);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:800;cursor:pointer}

.frm-lbl{display:block;font-size:12.5px;font-weight:700;color:var(--gray-800);margin-bottom:6px;font-family:'Montserrat',sans-serif}
select,input[type=text],input[type=date],input[type=datetime-local],input[type=number],textarea{width:100%;padding:11px 13px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:14px;font-family:'Open Sans',sans-serif;background:#fff;color:var(--gray-800)}
textarea{min-height:90px;resize:vertical}
.form-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{margin-bottom:12px}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;font-family:'Montserrat',sans-serif}
.badge-registered{background:var(--blue-light);color:var(--blue-dark)}
.badge-approved{background:#e6f8f0;color:#046a45}
.badge-rejected{background:var(--red-light);color:var(--red-dark)}
.badge-pending{background:#fff3cd;color:#7a5b00}
.badge-open{background:var(--blue-light);color:var(--blue-dark)}
.badge-full{background:#ffe6cc;color:#8a4a00}
.badge-closed{background:#e6f8f0;color:#046a45}
.badge-canceled{background:var(--red-light);color:var(--red-dark)}
.badge-published{background:#e6f8f0;color:#046a45}
.badge-unpublished{background:var(--gray-100);color:var(--gray-600)}
.report-box{border-top:1.5px solid var(--gray-200);margin-top:12px;padding-top:12px}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}

.reg-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-200);font-size:13px}
.reg-row label{display:flex;align-items:center;gap:8px;flex:1}
.reg-row .btn-unassign{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px}
.assign-row{display:flex;gap:8px;margin-top:10px}
.assign-row input{flex:1}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.checkbox-row input{width:auto}
.lookup-row{background:#fff;border:1.5px solid var(--gray-200);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13px}
.lookup-row b{color:var(--blue-dark)}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="ev-header">
  <div class="brand"><img src="../assets/img/logo-allcaremar.png" alt="Allcare Mar"/>
    <div><h1 id="hTitle"></h1><div class="sub" id="hSub"></div></div></div>
  <div class="ev-header-right">
    <button class="lang-toggle" id="langBtn">ES</button>
    <button class="btn-logout" id="logoutBtn"></button>
  </div>
</header>

<main class="ev-wrap">
  <div class="ev-banner" id="apiBanner"></div>

  <div class="ev-tabs" id="tabs">
    <div class="ev-tab on" data-t="open" id="tabOpen"></div>
    <div class="ev-tab" data-t="mine" id="tabMine"></div>
    <div class="ev-tab" data-t="suggest" id="tabSuggest"></div>
    <div class="ev-tab" data-t="admin" id="tabAdmin" style="display:none"></div>
  </div>

  <div class="ev-panel" id="p-open">
    <div class="ev-h2" id="hOpen"></div>
    <p class="ev-hint" id="hintOpen"></p>
    <div id="openEvents"></div>
  </div>

  <div class="ev-panel" id="p-mine" hidden>
    <div class="ev-h2" id="hMine"></div>
    <div id="myEvents"></div>
  </div>

  <div class="ev-panel" id="p-suggest" hidden>
    <div class="ev-h2" id="hSuggest"></div>
    <p class="ev-hint" id="hintSuggest"></p>
    <div class="form-card">
      <div class="grid2">
        <div class="field"><label class="frm-lbl" id="lblTitle"></label><input type="text" id="fTitle"></div>
        <div class="field"><label class="frm-lbl" id="lblOrganizer"></label><input type="text" id="fOrganizer"></div>
      </div>
      <div class="grid2">
        <div class="field"><label class="frm-lbl" id="lblAddress"></label><input type="text" id="fAddress"></div>
        <div class="field"><label class="frm-lbl" id="lblZip"></label><input type="text" id="fZip"></div>
      </div>
      <div class="grid2">
        <div class="field"><label class="frm-lbl" id="lblDate"></label><input type="date" id="fDate"></div>
        <div class="field"><label class="frm-lbl" id="lblTime"></label><input type="text" id="fTime" placeholder="10:00 AM - 4:00 PM"></div>
      </div>
      <div class="grid2">
        <div class="field"><label class="frm-lbl" id="lblDeadline"></label><input type="datetime-local" id="fDeadline"></div>
        <div class="field"><label class="frm-lbl" id="lblMaxSlots"></label><input type="number" id="fMaxSlots" value="4" min="1" max="10"></div>
      </div>
      <div class="field"><label class="frm-lbl" id="lblNotes"></label><textarea id="fNotes"></textarea></div>
      <button class="btn-primary" id="suggestBtn"></button>
      <div id="suggestSuccess" style="display:none;margin-top:12px;color:var(--green);font-weight:700;font-size:13.5px"></div>
    </div>
  </div>

  <div class="ev-panel" id="p-admin" hidden>
    <div class="ev-section">
      <div class="ev-h2" id="hLookup"></div>
      <p class="ev-hint" id="hintLookup"></p>
      <div style="display:flex;gap:10px;margin-bottom:14px">
        <input type="text" id="admLookupQ">
        <button class="btn-sec" id="admLookupBtn" style="white-space:nowrap"></button>
      </div>
      <div id="admLookupResults"></div>
    </div>

    <div class="ev-section">
      <div class="ev-h2" id="hPending"></div>
      <p class="ev-hint" id="hintPending"></p>
      <div id="admPendingEvents"></div>
    </div>

    <div class="ev-section">
      <div class="ev-h2" id="hManage"></div>
      <p class="ev-hint" id="hintManage"></p>
      <div id="admOpenEvents"></div>
    </div>

    <div class="ev-section">
      <div class="ev-h2" id="hCreate"></div>
      <div class="form-card">
        <div class="grid2">
          <div class="field"><label class="frm-lbl" id="admLblTitle"></label><input type="text" id="admFTitle"></div>
          <div class="field"><label class="frm-lbl" id="admLblOrganizer"></label><input type="text" id="admFOrganizer"></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="frm-lbl" id="lblOrgContact"></label><input type="text" id="admFOrgContact"></div>
          <div class="field"><label class="frm-lbl" id="lblOrgEmail"></label><input type="text" id="admFOrgEmail"></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="frm-lbl" id="lblOrgPhone"></label><input type="text" id="admFOrgPhone"></div>
          <div class="field"><label class="frm-lbl" id="admLblZip"></label><input type="text" id="admFZip"></div>
        </div>
        <div class="field"><label class="frm-lbl" id="admLblAddress"></label><input type="text" id="admFAddress"></div>
        <div class="grid2">
          <div class="field"><label class="frm-lbl" id="admLblDate"></label><input type="date" id="admFDate"></div>
          <div class="field"><label class="frm-lbl" id="admLblTime"></label><input type="text" id="admFTime" placeholder="10:00 AM - 4:00 PM"></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="frm-lbl" id="admLblDeadline"></label><input type="datetime-local" id="admFDeadline"></div>
          <div class="field"><label class="frm-lbl" id="admLblMaxSlots"></label><input type="number" id="admFMaxSlots" value="4" min="1" max="10"></div>
        </div>
        <div class="field"><label class="frm-lbl" id="admLblNotes"></label><textarea id="admFNotes"></textarea></div>
        <div class="checkbox-row"><input type="checkbox" id="admFPublished" checked><label class="frm-lbl" id="lblPublished" style="margin:0"></label></div>
        <button class="btn-primary" id="admCreateBtn"></button>
        <div id="admCreateSuccess" style="display:none;margin-top:12px;color:var(--green);font-weight:700;font-size:13.5px"></div>
      </div>
    </div>

    <div class="ev-section">
      <div class="ev-h2" id="hImport"></div>
      <p class="ev-hint" id="hintImport"></p>
      <div class="form-card">
        <input type="file" id="admImportFile" accept=".xlsx,.xls">
        <button class="btn-primary" id="admImportBtn" style="margin-top:12px"></button>
        <div id="admImportResult" style="margin-top:12px;font-size:12.5px;line-height:1.7"></div>
      </div>
    </div>

    <div class="ev-section">
      <div class="ev-h2" id="hHistory"></div>
      <div id="admHistoryEvents"></div>
    </div>
  </div>
</main>

// ---------------- Agent: open events ----------------

async function loadOpenEvents(){
  const events = await apiJson(API_BASE, '/events');
  const wrap = document.getElementById('openEvents');
  if (!events.length) { wrap.innerHTML = `<p class="ev-hint">${t('noOpen')}</p>`; return; }
  wrap.innerHTML = events.map(e => `
    <div class="event-card">
      <h3>${e.title}</h3>
      <div class="event-meta">
        ${t('organizer')}: ${e.organizer}<br>
        ${e.event_date}${e.event_time ? ' · ' + e.event_time : ''}<br>
        ${e.address}, ${e.zipcode} — <a href="${e.maps_link}" target="_blank" rel="noopener">${t('viewMap')}</a><br>
        ${t('deadline')}: ${new Date(e.registration_deadline).toLocaleString()}
      </div>
      <div class="event-foot">
        <span class="slots-pill ${e.slots_left===0?'full':''}">${e.slots_left>0 ? t('slotsLeft')(e.slots_left) : t('full')}</span>
        <button class="btn-primary" data-id="${e.id}" ${e.slots_left===0?'disabled':''}>${t('register')}</button>
      </div>
    </div>`).join('');
  wrap.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try { await apiJson(API_BASE, `/events/${btn.dataset.id}/register`, {method:'POST'}); loadOpenEvents(); loadMyEvents(); }
      catch(e) { alert(e.message); }
    });
  });
}

async function loadMyEvents(){
  const data = await apiJson(API_BASE, '/events/mine');
  const wrap = document.getElementById('myEvents');
  if (!data.registrations.length) { wrap.innerHTML = `<p class="ev-hint">${t('noMine')}</p>`; return; }
  const pendingIds = new Set(data.pending_reports.map(p=>p.event_id));
  wrap.innerHTML = data.registrations.map(r=>{
    const badgeClass = r.status==='approved'?'badge-approved':(r.status==='rejected'?'badge-rejected':'badge-registered');
    const badgeText = r.status==='approved'?t('statusApproved'):(r.status==='rejected'?t('statusRejected'):t('statusRegistered'));
    const needsReport = pendingIds.has(r.event_id);
    return `<div class="event-card">
      <h3>${r.title}</h3>
      <div class="event-meta">${r.event_date} — ${r.address}, ${r.zipcode}</div>
      <span class="badge ${badgeClass}">${badgeText}</span>
      ${needsReport ? `<div class="report-box">
        <p class="ev-hint">${t('reportPrompt')}</p>
        <textarea data-event="${r.event_id}" class="reportText" placeholder="${t('reportPlaceholder')}"></textarea>
        <label class="chk"><input type="checkbox" class="reportSale" data-event="${r.event_id}"> ${t('madeSale')}</label>
        <button class="btn-sec" data-submit-report="${r.event_id}">${t('sendReport')}</button>
        <div class="reportDone" data-done="${r.event_id}" style="display:none;color:var(--green);font-weight:700;font-size:13px;margin-top:8px">${t('reportSent')}</div>
      </div>` : ''}
    </div>`;
  }).join('');
  wrap.querySelectorAll('[data-submit-report]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const eventId = btn.dataset.submitReport;
      const text = wrap.querySelector(`.reportText[data-event="${eventId}"]`).value;
      const madeSale = wrap.querySelector(`.reportSale[data-event="${eventId}"]`).checked;
      if (!text.trim()) return;
      try {
        await apiJson(API_BASE, `/events/${eventId}/report`, {method:'POST', body:JSON.stringify({report_text:text, made_sale:madeSale})});
        btn.style.display = 'none';
        wrap.querySelector(`.reportDone[data-done="${eventId}"]`).style.display = 'block';
      } catch(e) { alert(e.message); }
    });
  });
}

document.getElementById('suggestBtn').addEventListener('click', async ()=>{
  const body = {
    title: document.getElementById('fTitle').value,
    organizer: document.getElementById('fOrganizer').value,
    address: document.getElementById('fAddress').value,
    zipcode: document.getElementById('fZip').value,
    event_date: document.getElementById('fDate').value,
    event_time: document.getElementById('fTime').value || null,
    registration_deadline: document.getElementById('fDeadline').value,
    max_slots: parseInt(document.getElementById('fMaxSlots').value || '4', 10),
    notes: document.getElementById('fNotes').value || null,
  };
  if (!body.title || !body.organizer || !body.address || !body.zipcode || !body.event_date || !body.registration_deadline) {
    alert(curLang==='en' ? 'Please complete all required fields.' : 'Completa todos los campos requeridos.');
    return;
  }
  try {
    await apiJson(API_BASE, '/events/suggest', {method:'POST', body: JSON.stringify(body)});
    document.getElementById('suggestSuccess').style.display = 'block';

// ---------------- Administration (only for EVENTS_ADMIN_EMAILS) ----------------

async function loadAdminPending(){
  const events = await apiJson(API_BASE, '/events/admin/all?status=pending_approval');
  const wrap = document.getElementById('admPendingEvents');
  if (!events.length) { wrap.innerHTML = `<p class="ev-hint">${t('noPending')}</p>`; return; }
  wrap.innerHTML = events.map(e => `
    <div class="event-card">
      <h3>${e.title} <span class="badge badge-pending">${curLang==='en'?'Suggested by':'Sugerido por'} ${e.suggested_by_name || e.suggested_by_email}</span></h3>
      <div class="event-meta">
        ${e.organizer} · ${e.event_date}${e.event_time ? ' · ' + e.event_time : ''}<br>
        ${e.address}, ${e.zipcode}<br>
        ${e.notes ? e.notes + '<br>' : ''}
      </div>
      <div class="event-foot">
        <div></div>
        <div style="display:flex;gap:8px">
          <button class="btn-approve" data-approve="${e.id}">${t('approve')}</button>
          <button class="btn-reject" data-reject="${e.id}">${t('reject')}</button>
        </div>
      </div>
    </div>`).join('');
  wrap.querySelectorAll('[data-approve]').forEach(btn=>btn.addEventListener('click', async ()=>{
    await apiJson(API_BASE, `/events/admin/${btn.dataset.approve}/approve-suggestion`, {method:'POST'}); loadAdminAll();
  }));
  wrap.querySelectorAll('[data-reject]').forEach(btn=>btn.addEventListener('click', async ()=>{
    await apiJson(API_BASE, `/events/admin/${btn.dataset.reject}/reject-suggestion`, {method:'POST'}); loadAdminAll();
  }));
}

async function loadAdminManage(){
  const events = await apiJson(API_BASE, '/events/admin/all?status=open');
  const full = await apiJson(API_BASE, '/events/admin/all?status=full');
  const wrap = document.getElementById('admOpenEvents');
  const all = [...full, ...events];
  if (!all.length) { wrap.innerHTML = `<p class="ev-hint">${t('noManage')}</p>`; return; }
  const blocks = await Promise.all(all.map(async e => {
    const regs = await apiJson(API_BASE, `/events/admin/${e.id}/registrations`);
    return { e, regs };
  }));
  wrap.innerHTML = blocks.map(({e, regs}) => `
    <div class="event-card">
      <h3>${e.title}
        <span class="badge ${e.status==='full'?'badge-full':'badge-open'}">${e.status==='full'?t('statusFull'):t('statusOpen')}</span>
        <span class="badge ${e.published?'badge-published':'badge-unpublished'}">${e.published?t('badgePublished'):t('badgeUnpublished')}</span>
      </h3>
      <div class="event-meta">
        ${e.organizer} · ${e.event_date}${e.event_time ? ' · ' + e.event_time : ''} · ${e.address}, ${e.zipcode}<br>
        ${e.slots_taken}/${e.max_slots}
      </div>
      <div style="margin-top:10px">
        ${regs.map(r => `<div class="reg-row"><label><input type="checkbox" class="attendCheck" data-event="${e.id}" value="${r.agent_email}" checked> ${r.agent_name} (${r.agent_email})</label><span class="ev-hint" style="margin:0">${t('registered')} ${new Date(r.registered_at).toLocaleString()}</span><button type="button" class="btn-unassign" data-unassign="${e.id}" data-email="${r.agent_email}" title="${t('cancel')}">×</button></div>`).join('')}
      </div>
      <div class="assign-row">
        <input type="text" class="assignInput" data-event="${e.id}" placeholder="${t('assignPh')}">
        <button class="btn-sec" data-assign="${e.id}">${t('assignBtn')}</button>
      </div>
      <div class="event-foot">
        <div style="display:flex;gap:8px">
          <button class="btn-sec" data-cancel="${e.id}">${t('cancel')}</button>
          <button class="btn-sec" data-toggle-publish="${e.id}">${e.published?t('unpublishBtn'):t('publishBtn')}</button>
        </div>
        <button class="btn-primary" data-finalize="${e.id}">${t('finalize')}</button>
      </div>
    </div>`).join('');
  wrap.querySelectorAll('[data-finalize]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const eventId = btn.dataset.finalize;
    const emails = Array.from(wrap.querySelectorAll(`.attendCheck[data-event="${eventId}"]:checked`)).map(c=>c.value);
    await apiJson(API_BASE, `/events/admin/${eventId}/finalize`, {method:'POST', body: JSON.stringify({approved_emails: emails})});
    loadAdminAll();
  }));
  wrap.querySelectorAll('[data-cancel]').forEach(btn=>btn.addEventListener('click', async ()=>{
    await apiJson(API_BASE, `/events/admin/${btn.dataset.cancel}/cancel`, {method:'POST'}); loadAdminAll();
  }));
  wrap.querySelectorAll('[data-toggle-publish]').forEach(btn=>btn.addEventListener('click', async ()=>{
    await apiJson(API_BASE, `/events/admin/${btn.dataset.togglePublish}/toggle-publish`, {method:'POST'}); loadAdminAll();
  }));
  wrap.querySelectorAll('[data-unassign]').forEach(btn=>btn.addEventListener('click', async ()=>{
    if (!confirm(curLang==='en' ? 'Remove this agent from the event?' : '¿Quitar a este agente del evento?')) return;
    await apiJson(API_BASE, `/events/admin/${btn.dataset.unassign}/unassign`, {method:'POST', body: JSON.stringify({agent_email: btn.dataset.email})});
    loadAdminAll();
  }));
  wrap.querySelectorAll('[data-assign]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const eventId = btn.dataset.assign;
    const input = wrap.querySelector(`.assignInput[data-event="${eventId}"]`);
    const email = input.value.trim();
    if (!email) return;
    try {
      await apiJson(API_BASE, `/events/admin/${eventId}/assign`, {method:'POST', body: JSON.stringify({agent_email: email})});
      loadAdminAll();
    } catch(e) { alert(e.message); }
  }));
}

async function loadAdminLookup(){
  const q = document.getElementById('admLookupQ').value.trim();
  const wrap = document.getElementById('admLookupResults');
  if (!q) { wrap.innerHTML = `<p class="ev-hint">${t('lookupNoQuery')}</p>`; return; }
  const rows = await apiJson(API_BASE, '/events/admin/agent-lookup?q=' + encodeURIComponent(q));
  if (!rows.length) { wrap.innerHTML = `<p class="ev-hint">${t('lookupEmpty')}</p>`; return; }
  const statusLbl = {registered:'regStatusRegistered', approved:'regStatusApproved', rejected:'regStatusRejected'};
  wrap.innerHTML = rows.map(r => `
    <div class="lookup-row">
      <b>${r.agent_name}</b> (${r.agent_email})<br>
      ${r.title} — ${r.event_date} · ${t(statusLbl[r.registration_status] || 'regStatusRegistered')}
      · <span class="badge ${r.published?'badge-published':'badge-unpublished'}">${r.published?t('badgePublished'):t('badgeUnpublished')}</span>
    </div>`).join('');
}
document.getElementById('admLookupBtn').addEventListener('click', loadAdminLookup);
document.getElementById('admLookupQ').addEventListener('keydown', (e)=>{ if (e.key === 'Enter') loadAdminLookup(); });

async function loadAdminHistory(){
  const statuses = ['closed_confirmed','closed_incomplete','canceled'];
  const lists = await Promise.all(statuses.map(s => apiJson(API_BASE, `/events/admin/all?status=${s}`)));
  const all = lists.flat().sort((a,b) => new Date(b.event_date) - new Date(a.event_date));
  const badgeMap = { closed_confirmed:['badge-closed','statusClosedConfirmed'], closed_incomplete:['badge-full','statusClosedIncomplete'], canceled:['badge-canceled','statusCanceled'] };
  const wrap = document.getElementById('admHistoryEvents');
  if (!all.length) { wrap.innerHTML = `<p class="ev-hint">${t('noHistory')}</p>`; return; }
  wrap.innerHTML = all.map(e => {
    const [cls, key] = badgeMap[e.status];
    return `<div class="event-card"><h3>${e.title} <span class="badge ${cls}">${t(key)}</span></h3>
      <div class="event-meta">${e.organizer} · ${e.event_date} · ${e.address}, ${e.zipcode}</div></div>`;
  }).join('');
}

document.getElementById('admCreateBtn').addEventListener('click', async ()=>{
  const body = {
    title: document.getElementById('admFTitle').value,
    organizer: document.getElementById('admFOrganizer').value,
    organizer_contact: document.getElementById('admFOrgContact').value || null,
    organizer_email: document.getElementById('admFOrgEmail').value || null,
    organizer_phone: document.getElementById('admFOrgPhone').value || null,
    address: document.getElementById('admFAddress').value,
    zipcode: document.getElementById('admFZip').value,
    event_date: document.getElementById('admFDate').value,
    event_time: document.getElementById('admFTime').value || null,
    registration_deadline: document.getElementById('admFDeadline').value,

  };
  if (!body.title || !body.organizer || !body.address || !body.zipcode || !body.event_date || !body.registration_deadline) {
    alert(curLang==='en' ? 'Please complete all required fields.' : 'Completa todos los campos requeridos.');
    return;
  }
  try {
    await apiJson(API_BASE, '/events/admin', {method:'POST', body: JSON.stringify(body)});

    ['admFTitle','admFOrganizer','admFOrgContact','admFOrgEmail','admFOrgPhone','admFAddress','admFZip','admFDate','admFTime','admFDeadline','admFNotes'].forEach(id=>document.getElementById(id).value='');

document.getElementById('admImportBtn').addEventListener('click', async ()=>{
  const fileInput = document.getElementById('admImportFile');
  const file = fileInput.files[0];
  const resultDiv = document.getElementById('admImportResult');
  if (!file) { alert(t('chooseFile')); return; }
  const btn = document.getElementById('admImportBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = t('importing');
  resultDiv.innerHTML = '';
  try {
    const fd = new FormData();
    fd.append('file', file);
    const r = await apiJson(API_BASE, '/events/admin/import', {method:'POST', body: fd});
    let html = `<p style="color:var(--green);font-weight:700">${t('importOk')(r.imported)}</p>`;
    if (r.skipped && r.skipped.length) {
      html += `<p style="margin-top:8px">${t('importSkipped')(r.skipped.length)}</p><ul style="margin-left:18px">` +
        r.skipped.map(s => `<li>${curLang==='en'?'Row':'Fila'} ${s.row}${s.event ? ' ("'+s.event+'")' : ''}: ${s.reason}</li>`).join('') + `</ul>`;
    }
    resultDiv.innerHTML = html;
    fileInput.value = '';
    loadAdminAll();
  } catch(e) {
    resultDiv.innerHTML = `<p style="color:var(--red)">${e.message}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

async function loadAdminAll(){
  await loadAdminPending();
  await loadAdminManage();
  await loadAdminHistory();
}

// ---------------- Init ----------------

async function init(){
  if (!session) return;
  applyStaticText();
  if (!apiReady()) {
    document.getElementById('apiBanner').classList.add('show');
    document.getElementById('apiBanner').textContent = t('apiPending');
    return;
  }
  try { await loadOpenEvents(); await loadMyEvents(); }
  catch(e) {
    document.getElementById('apiBanner').classList.add('show');
    document.getElementById('apiBanner').textContent = e.message;
  }
  // No dedicated "am I an admin" endpoint - probing an admin-only call is
  // the same technique the old standalone events-admin.html used (it just
  // showed a "denied" banner on failure). Here we just keep the tab hidden
  // for non-admins instead, same as sales-report.html's Admin tab pattern.
  try {
    await apiJson(API_BASE, '/events/admin/all?status=open');
    isEventsAdmin = true;
    document.getElementById('tabAdmin').style.display = 'block';
    // Email links (e.g. "event full" notifications) point here with
    // ?tab=admin so admins land straight on the Administration tab.
    if (new URLSearchParams(window.location.search).get('tab') === 'admin') {
      document.getElementById('tabAdmin').click();
    }
  } catch(e) { /* not an events admin - tab stays hidden */ }
}
init();
