<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Events — Allcare Mar Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --blue:#1a2fd4; --blue-dark:#0f1e9a; --blue-light:#e8ecff;
  --red:#e8001d; --red-dark:#b50016; --red-light:#fff0f2;
  --gray-50:#faf8f5; --gray-100:#f3efe9; --gray-200:#e6e0d6;
  --gray-400:#8b8377; --gray-600:#544f47; --gray-800:#2b2723;
  --green:#00a86b;
  --r:12px; --r-lg:20px;
  --sh:0 4px 24px rgba(58,53,48,.08); --sh-lg:0 16px 56px rgba(58,53,48,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;color:var(--gray-800);background:var(--gray-50);min-height:100vh}
h1,h2,h3{font-family:'Montserrat',sans-serif;line-height:1.2}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

.ev-header{display:flex;align-items:center;justify-content:space-between;padding:18px 5vw;background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;flex-wrap:wrap;gap:12px}
.ev-header .brand{display:flex;align-items:center;gap:14px}
.ev-header .brand img{height:30px;filter:brightness(0) invert(1)}
.ev-header h1{font-size:16px;font-weight:800}
.ev-header .sub{font-size:11.5px;opacity:.8}
.ev-header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lang-toggle{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:11.5px;cursor:pointer}
.btn-logout{background:var(--red);border:none;color:#fff;padding:9px 16px;border-radius:20px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer}

.ev-wrap{max-width:900px;margin:0 auto;padding:32px 5vw 80px}
.ev-banner{background:#fff3cd;border:1px solid #ffe08a;color:#7a5b00;font-size:13px;padding:14px 18px;border-radius:10px;margin-bottom:22px;line-height:1.6;display:none}
.ev-banner.show{display:block}
.ev-section{margin-bottom:36px}
.ev-h2{font-size:17px;font-weight:800;color:var(--blue-dark);margin-bottom:4px}
.ev-hint{font-size:12.5px;color:var(--gray-600);margin-bottom:16px}

.event-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh)}
.event-card h3{font-size:15px;color:var(--blue-dark);margin-bottom:6px}
.event-meta{font-size:12.5px;color:var(--gray-600);line-height:1.8}
.event-meta a{color:var(--blue)}
.event-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:10px}
.slots-pill{font-family:'Montserrat',sans-serif;font-weight:800;font-size:11.5px;padding:5px 12px;border-radius:20px;background:var(--blue-light);color:var(--blue-dark)}
.slots-pill.full{background:var(--red-light);color:var(--red-dark)}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;cursor:pointer}
.btn-primary:hover{background:var(--blue-dark)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sec{background:#fff;border:1.5px solid var(--blue);color:var(--blue-dark);padding:9px 16px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer}

.frm-lbl{display:block;font-size:12.5px;font-weight:700;color:var(--gray-800);margin-bottom:6px;font-family:'Montserrat',sans-serif}
select,input[type=text],input[type=date],input[type=datetime-local],input[type=number],textarea{width:100%;padding:11px 13px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:14px;font-family:'Open Sans',sans-serif;background:#fff;color:var(--gray-800)}
textarea{min-height:90px;resize:vertical}
.form-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{margin-bottom:12px}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;font-family:'Montserrat',sans-serif}
.badge-registered{background:var(--blue-light);color:var(--blue-dark)}
.badge-approved{background:#e6f8f0;color:#046a45}
.badge-rejected{background:var(--red-light);color:var(--red-dark)}
.report-box{border-top:1.5px solid var(--gray-200);margin-top:12px;padding-top:12px}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="ev-header">
  <div class="brand"><img src="../assets/img/logo-allcaremar.png" alt="Allcare Mar"/>
    <div><h1 id="hTitle"></h1><div class="sub" id="hSub"></div></div></div>
  <div class="ev-header-right">
    <button class="lang-toggle" id="langBtn">ES</button>
    <button class="btn-logout" id="logoutBtn"></button>
  </div>
</header>

<main class="ev-wrap">
  <div class="ev-banner" id="apiBanner"></div>

  <section class="ev-section">
    <div class="ev-h2" id="hOpen"></div>
    <p class="ev-hint" id="hintOpen"></p>
    <div id="openEvents"></div>
  </section>

  <section class="ev-section">
    <div class="ev-h2" id="hMine"></div>
    <div id="myEvents"></div>
  </section>

  <section class="ev-section">
    <div class="ev-h2" id="hSuggest"></div>
    <p class="ev-hint" id="hintSuggest"></p>
    <div class="form-card">
      <div class="grid2">
        <div class="field"><label class="frm-lbl" id="lblTitle"></label><input type="text" id="fTitle"></div>
        <div class="field"><label class="frm-lbl" id="lblOrganizer"></label><input type="text" id="fOrganizer"></div>
      </div>
      <div class="grid2">
        <div class="field"><label class="frm-lbl" id="lblAddress"></label><input type="text" id="fAddress"></div>
        <div class="field"><label class="frm-lbl" id="lblZip"></label><input type="text" id="fZip"></div>
      </div>
      <div class="grid2">
        <div class="field"><label class="frm-lbl" id="lblDate"></label><input type="date" id="fDate"></div>
        <div class="field"><label class="frm-lbl" id="lblTime"></label><input type="text" id="fTime" placeholder="10:00 AM - 4:00 PM"></div>
      </div>
      <div class="grid2">
        <div class="field"><label class="frm-lbl" id="lblDeadline"></label><input type="datetime-local" id="fDeadline"></div>
        <div class="field"><label class="frm-lbl" id="lblMaxSlots"></label><input type="number" id="fMaxSlots" value="4" min="1" max="10"></div>
      </div>
      <div class="field"><label class="frm-lbl" id="lblNotes"></label><textarea id="fNotes"></textarea></div>
      <button class="btn-primary" id="suggestBtn"></button>
      <div id="suggestSuccess" style="display:none;margin-top:12px;color:var(--green);font-weight:700;font-size:13.5px"></div>
    </div>
  </section>
</main>

<script type="module">
import { API_BASE, apiReady } from "./assets/js/api-config.js";
import { guard, apiJson } from "./assets/js/agent-api-session.js";

const session = guard();
let curLang = 'en';

const I18N = {
en:{
  title:"Events", sub:"Allcare Mar Agency", logout:"Sign out",
  apiPending:"This tool is being connected to the server — check back soon.",
  hOpen:"Open events", hintOpen:"Sign up if you're interested — the agency confirms who actually attends once registration closes.",
  noOpen:"No open events right now.",
  organizer:"Organizer", deadline:"Registration deadline", viewMap:"View on Google Maps",
  slotsLeft:n=>n+" spot(s) left", full:"Full — awaiting approval", register:"Sign up",
  alreadyIn:"You're already signed up",
  hMine:"My events", noMine:"You haven't signed up for any event yet.",
  statusRegistered:"Registered", statusApproved:"Confirmed", statusRejected:"Not selected this time",
  reportPrompt:"This event already happened — tell us how it went:",
  reportPlaceholder:"How did it go? Any issues, was it a success, was it hard to get to, etc.",
  madeSale:"I made a sale at this event", sendReport:"Send report", reportSent:"✓ Report sent — thank you.",
  hSuggest:"Suggest an event", hintSuggest:"We'll review it before it appears in the open events list above.",
  lblTitle:"Event name", lblOrganizer:"Organizer", lblAddress:"Address", lblZip:"Zip code",
  lblDate:"Event date", lblTime:"Time (optional)", lblDeadline:"Registration deadline", lblMaxSlots:"Max agents",
  lblNotes:"Notes (optional)", suggestBtn:"Submit for review", suggestSuccess:"✓ Submitted — we'll review it soon.",
},
es:{
  title:"Eventos", sub:"Allcare Mar Agency", logout:"Cerrar sesión",
  apiPending:"Esta herramienta se está conectando al servidor — vuelve pronto.",
  hOpen:"Eventos abiertos", hintOpen:"Inscríbete si te interesa — la agencia confirma quién asiste realmente cuando cierra la inscripción.",
  noOpen:"No hay eventos abiertos por ahora.",
  organizer:"Organizador", deadline:"Fecha límite de inscripción", viewMap:"Ver en Google Maps",
  slotsLeft:n=>n+" cupo(s) disponible(s)", full:"Cupo lleno — esperando aprobación", register:"Inscribirme",
  alreadyIn:"Ya estás inscrito",
  hMine:"Mis eventos", noMine:"Todavía no te has inscrito a ningún evento.",
  statusRegistered:"Inscrito", statusApproved:"Confirmado", statusRejected:"No seleccionado esta vez",
  reportPrompt:"Este evento ya pasó — cuéntanos cómo te fue:",
  reportPlaceholder:"¿Cómo te fue? Situaciones, si fue un éxito, si fue difícil llegar, etc.",
  madeSale:"Hice una venta en este evento", sendReport:"Enviar reporte", reportSent:"✓ Reporte enviado — gracias.",
  hSuggest:"Sugerir un evento", hintSuggest:"Lo revisamos antes de que aparezca en el listado de eventos abiertos.",
  lblTitle:"Nombre del evento", lblOrganizer:"Organizador", lblAddress:"Dirección", lblZip:"Código postal",
  lblDate:"Fecha del evento", lblTime:"Horario (opcional)", lblDeadline:"Fecha límite de inscripción", lblMaxSlots:"Máximo de agentes",
  lblNotes:"Notas (opcional)", suggestBtn:"Enviar para revisión", suggestSuccess:"✓ Enviado — lo revisaremos pronto.",
}
};
function t(k){ return I18N[curLang][k]; }

function applyStaticText(){
  document.getElementById('hTitle').textContent = t('title');
  document.getElementById('hSub').textContent = t('sub');
  document.getElementById('logoutBtn').textContent = t('logout');
  document.getElementById('hOpen').textContent = t('hOpen');
  document.getElementById('hintOpen').textContent = t('hintOpen');
  document.getElementById('hMine').textContent = t('hMine');
  document.getElementById('hSuggest').textContent = t('hSuggest');
  document.getElementById('hintSuggest').textContent = t('hintSuggest');
  document.getElementById('lblTitle').textContent = t('lblTitle');
  document.getElementById('lblOrganizer').textContent = t('lblOrganizer');
  document.getElementById('lblAddress').textContent = t('lblAddress');
  document.getElementById('lblZip').textContent = t('lblZip');
  document.getElementById('lblDate').textContent = t('lblDate');
  document.getElementById('lblTime').textContent = t('lblTime');
  document.getElementById('lblDeadline').textContent = t('lblDeadline');
  document.getElementById('lblMaxSlots').textContent = t('lblMaxSlots');
  document.getElementById('lblNotes').textContent = t('lblNotes');
  document.getElementById('suggestBtn').textContent = t('suggestBtn');
}

document.getElementById('langBtn').addEventListener('click', ()=>{
  curLang = curLang === 'en' ? 'es' : 'en';
  document.getElementById('langBtn').textContent = curLang === 'en' ? 'ES' : 'EN';
  applyStaticText();
  loadOpenEvents(); loadMyEvents();
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem('acm_gsession');
  if (typeof google !== 'undefined' && google.accounts) { try { google.accounts.id.disableAutoSelect(); } catch(e){} }
  window.location.href = '../login.html';
});

async function loadOpenEvents(){
  const events = await apiJson(API_BASE, '/events');
  const wrap = document.getElementById('openEvents');
  if (!events.length) { wrap.innerHTML = `<p class="ev-hint">${t('noOpen')}</p>`; return; }
  wrap.innerHTML = events.map(e => `
    <div class="event-card">
      <h3>${e.title}</h3>
      <div class="event-meta">
        ${t('organizer')}: ${e.organizer}<br>
        ${e.event_date}${e.event_time ? ' · ' + e.event_time : ''}<br>
        ${e.address}, ${e.zipcode} — <a href="${e.maps_link}" target="_blank" rel="noopener">${t('viewMap')}</a><br>
        ${t('deadline')}: ${new Date(e.registration_deadline).toLocaleString()}
      </div>
      <div class="event-foot">
        <span class="slots-pill ${e.slots_left===0?'full':''}">${e.slots_left>0 ? t('slotsLeft')(e.slots_left) : t('full')}</span>
        <button class="btn-primary" data-id="${e.id}" ${e.slots_left===0?'disabled':''}>${t('register')}</button>
      </div>
    </div>`).join('');
  wrap.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try { await apiJson(API_BASE, `/events/${btn.dataset.id}/register`, {method:'POST'}); loadOpenEvents(); loadMyEvents(); }
      catch(e) { alert(e.message); }
    });
  });
}

async function loadMyEvents(){
  const data = await apiJson(API_BASE, '/events/mine');
  const wrap = document.getElementById('myEvents');
  if (!data.registrations.length) { wrap.innerHTML = `<p class="ev-hint">${t('noMine')}</p>`; return; }
  const pendingIds = new Set(data.pending_reports.map(p=>p.event_id));
  wrap.innerHTML = data.registrations.map(r=>{
    const badgeClass = r.status==='approved'?'badge-approved':(r.status==='rejected'?'badge-rejected':'badge-registered');
    const badgeText = r.status==='approved'?t('statusApproved'):(r.status==='rejected'?t('statusRejected'):t('statusRegistered'));
    const needsReport = pendingIds.has(r.event_id);
    return `<div class="event-card">
      <h3>${r.title}</h3>
      <div class="event-meta">${r.event_date} — ${r.address}, ${r.zipcode}</div>
      <span class="badge ${badgeClass}">${badgeText}</span>
      ${needsReport ? `<div class="report-box">
        <p class="ev-hint">${t('reportPrompt')}</p>
        <textarea data-event="${r.event_id}" class="reportText" placeholder="${t('reportPlaceholder')}"></textarea>
        <label class="chk"><input type="checkbox" class="reportSale" data-event="${r.event_id}"> ${t('madeSale')}</label>
        <button class="btn-sec" data-submit-report="${r.event_id}">${t('sendReport')}</button>
        <div class="reportDone" data-done="${r.event_id}" style="display:none;color:var(--green);font-weight:700;font-size:13px;margin-top:8px">${t('reportSent')}</div>
      </div>` : ''}
    </div>`;
  }).join('');
  wrap.querySelectorAll('[data-submit-report]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const eventId = btn.dataset.submitReport;
      const text = wrap.querySelector(`.reportText[data-event="${eventId}"]`).value;
      const madeSale = wrap.querySelector(`.reportSale[data-event="${eventId}"]`).checked;
      if (!text.trim()) return;
      try {
        await apiJson(API_BASE, `/events/${eventId}/report`, {method:'POST', body:JSON.stringify({report_text:text, made_sale:madeSale})});
        btn.style.display = 'none';
        wrap.querySelector(`.reportDone[data-done="${eventId}"]`).style.display = 'block';
      } catch(e) { alert(e.message); }
    });
  });
}

document.getElementById('suggestBtn').addEventListener('click', async ()=>{
  const body = {
    title: document.getElementById('fTitle').value,
    organizer: document.getElementById('fOrganizer').value,
    address: document.getElementById('fAddress').value,
    zipcode: document.getElementById('fZip').value,
    event_date: document.getElementById('fDate').value,
    event_time: document.getElementById('fTime').value || null,
    registration_deadline: document.getElementById('fDeadline').value,
    max_slots: parseInt(document.getElementById('fMaxSlots').value || '4', 10),
    notes: document.getElementById('fNotes').value || null,
  };
  if (!body.title || !body.organizer || !body.address || !body.zipcode || !body.event_date || !body.registration_deadline) {
    alert(curLang==='en' ? 'Please complete all required fields.' : 'Completa todos los campos requeridos.');
    return;
  }
  try {
    await apiJson(API_BASE, '/events/suggest', {method:'POST', body: JSON.stringify(body)});
    document.getElementById('suggestSuccess').style.display = 'block';
    document.getElementById('suggestSuccess').textContent = t('suggestSuccess');
    ['fTitle','fOrganizer','fAddress','fZip','fDate','fTime','fDeadline','fNotes'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fMaxSlots').value = 4;
  } catch(e) { alert(e.message); }
});

async function init(){
  if (!session) return;
  applyStaticText();
  if (!apiReady()) {
    document.getElementById('apiBanner').classList.add('show');
    document.getElementById('apiBanner').textContent = t('apiPending');
    return;
  }
  try { await loadOpenEvents(); await loadMyEvents(); }
  catch(e) {
    document.getElementById('apiBanner').classList.add('show');
    document.getElementById('apiBanner').textContent = e.message;
  }
}
init();
</script>
</body>
</html>
