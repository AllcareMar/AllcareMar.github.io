<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>IT Support — Allcare Mar Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --blue:#1a2fd4; --blue-dark:#0f1e9a; --blue-light:#e8ecff;
  --red:#e8001d; --red-dark:#b50016; --red-light:#fff0f2;
  --gray-50:#faf8f5; --gray-100:#f3efe9; --gray-200:#e6e0d6;
  --gray-400:#8b8377; --gray-600:#544f47; --gray-800:#2b2723;
  --green:#00a86b; --amber:#b8860b;
  --r:12px; --r-lg:20px;
  --sh:0 4px 24px rgba(58,53,48,.08); --sh-lg:0 16px 56px rgba(58,53,48,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;color:var(--gray-800);background:var(--gray-50);min-height:100vh}
h1,h2,h3{font-family:'Montserrat',sans-serif;line-height:1.2}
a{text-decoration:none;color:inherit}

.ev-header{display:flex;align-items:center;justify-content:space-between;padding:18px 5vw;background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;flex-wrap:wrap;gap:12px}
.ev-header .brand{display:flex;align-items:center;gap:14px}
.ev-header .brand img{height:30px;filter:brightness(0) invert(1)}
.ev-header h1{font-size:16px;font-weight:800}
.ev-header .sub{font-size:11.5px;opacity:.8}
.ev-header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lang-toggle{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 14px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:11.5px;cursor:pointer}
.btn-logout{background:var(--red);border:none;color:#fff;padding:9px 16px;border-radius:20px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer}

.ev-wrap{max-width:820px;margin:0 auto;padding:32px 5vw 80px}
.ev-banner{background:#fff3cd;border:1px solid #ffe08a;color:#7a5b00;font-size:13px;padding:14px 18px;border-radius:10px;margin-bottom:22px;line-height:1.6;display:none}
.ev-banner.show{display:block}

.ev-tabs{display:flex;gap:4px;flex-wrap:wrap}
.ev-tab{padding:11px 18px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;border:1.5px solid var(--gray-200);border-bottom:none;border-radius:12px 12px 0 0;cursor:pointer;background:var(--gray-100);color:var(--gray-600)}
.ev-tab.on{background:#fff;color:var(--blue-dark);border-color:var(--gray-200)}
.ev-panel{border:1.5px solid var(--gray-200);border-radius:0 var(--r-lg) var(--r-lg) var(--r-lg);padding:24px;background:#fff;box-shadow:var(--sh)}
.ev-h2{font-size:17px;font-weight:800;color:var(--blue-dark);margin-bottom:4px}
.ev-hint{font-size:12.5px;color:var(--gray-600);margin-bottom:16px}
.ev-section{margin-bottom:28px}
.ev-section:last-child{margin-bottom:0}

.ev-subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.ev-subtab{padding:9px 16px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;border:1.5px solid var(--gray-200);border-bottom:none;border-radius:10px 10px 0 0;cursor:pointer;background:var(--gray-100);color:var(--gray-600)}
.ev-subtab.on{background:#fff;color:var(--blue-dark);border-color:var(--gray-200)}

.field{margin-bottom:14px}
.frm-lbl{display:block;font-size:12.5px;font-weight:700;color:var(--gray-800);margin-bottom:6px;font-family:'Montserrat',sans-serif}
select,input[type=text],input[type=file],textarea{width:100%;padding:11px 13px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:14px;font-family:'Open Sans',sans-serif;background:#fff;color:var(--gray-800)}
textarea{min-height:90px;resize:vertical}
.autofield{background:var(--gray-50);color:var(--gray-600);padding:11px 13px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:14px}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;cursor:pointer}
.btn-primary:disabled{background:var(--gray-400);color:#fff;opacity:1;cursor:not-allowed}
.btn-sec{background:#fff;border:1.5px solid var(--blue);color:var(--blue-dark);padding:9px 14px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.btn-sec:disabled{opacity:.5;cursor:default}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}

.event-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh)}
.tk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.tk-cat{font-family:'Montserrat',sans-serif;font-weight:800;font-size:13.5px;color:var(--gray-800)}
.tk-meta{font-size:12px;color:var(--gray-600);margin-top:3px}
.tk-detail{font-size:13px;color:var(--gray-600);margin-top:8px;line-height:1.5;white-space:pre-wrap}
.tk-photo{font-size:12px;margin-top:8px}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:800;font-family:'Montserrat',sans-serif;white-space:nowrap}
.badge-open{background:var(--red-light);color:var(--red-dark)}
.badge-in_progress{background:#fff3cd;color:var(--amber)}
.badge-resolved{background:#e6f8f0;color:#046a45}
.thread{border-top:1.5px solid var(--gray-200);margin-top:12px;padding-top:10px}
.thread-item{font-size:12.5px;color:var(--gray-600);padding:6px 0;border-bottom:1px dashed var(--gray-200)}
.thread-item:last-child{border-bottom:none}
.thread-item b{color:var(--gray-800)}
.thread-item.resolution{color:#046a45}
.reply-box{margin-top:12px;border-top:1.5px solid var(--gray-200);padding-top:12px}
.assign-row{margin-top:10px}
.frm-hint{font-size:11.5px;color:var(--gray-400);margin-top:4px}
</style>
</head>
<body>
<header class="ev-header">
  <div class="brand"><img src="../assets/img/logo-allcaremar.png" alt="Allcare Mar"/>
    <div><h1 id="hTitle"></h1><div class="sub" id="hSub"></div></div></div>
  <div class="ev-header-right">
    <button class="lang-toggle" id="langBtn">ES</button>
    <button class="btn-logout" id="logoutBtn"></button>
  </div>
</header>

<main class="ev-wrap">
  <div class="ev-banner" id="apiBanner"></div>

  <div class="ev-tabs" id="tabs">
    <div class="ev-tab on" data-t="report" id="tabReport"></div>
    <div class="ev-tab" data-t="mine" id="tabMine"></div>
    <div class="ev-tab" data-t="admin" id="tabAdmin" style="display:none"></div>
  </div>

  <div class="ev-panel" id="p-report">
    <div class="ev-h2" id="hReport"></div>
    <p class="ev-hint" id="hintReport"></p>

    <div class="field">
      <label class="frm-lbl" id="lblRequester"></label>
      <div class="autofield" id="requesterAutofield"></div>
    </div>
    <div class="field">
      <label class="frm-lbl" id="lblCategory"></label>
      <select id="fCategory"></select>
    </div>
    <div class="field">
      <label class="frm-lbl" id="lblDetails"></label>
      <textarea id="fDetails"></textarea>
    </div>
    <div class="field">
      <label class="frm-lbl" id="lblPhoto"></label>
      <input type="file" id="fPhoto" accept="image/*">
      <div class="frm-hint" id="hintPhoto"></div>
    </div>
    <div class="field">
      <label class="frm-lbl" id="lblRemote"></label>
      <select id="fRemote"></select>
    </div>
    <button class="btn-primary" id="submitTicketBtn"></button>
    <div id="ticketSuccess" style="display:none;margin-top:12px;color:var(--green);font-weight:700;font-size:13.5px"></div>
    <div id="ticketError" style="display:none;margin-top:12px;color:var(--red);font-weight:700;font-size:13.5px"></div>
  </div>

  <div class="ev-panel" id="p-mine" hidden>
    <div class="ev-h2" id="hMine"></div>
    <div id="myTickets"></div>
  </div>

  <div class="ev-panel" id="p-admin" hidden>
    <div class="ev-subtabs" id="adminSubtabs">
      <div class="ev-subtab on" data-st="open" id="subtabOpen"></div>
      <div class="ev-subtab" data-st="in_progress" id="subtabProgress"></div>
      <div class="ev-subtab" data-st="resolved" id="subtabResolved"></div>
    </div>
    <div style="border:1.5px solid var(--gray-200);border-top:none;border-radius:0 0 var(--r-lg) var(--r-lg);padding:20px;background:#fff">
      <div id="adminTickets"></div>
    </div>
  </div>
</main>

function t(k){ return I18N[curLang][k]; }

function applyStaticText(){
  document.getElementById('hTitle').textContent = t('title');
  document.getElementById('hSub').textContent = t('sub');
  document.getElementById('logoutBtn').textContent = t('logout');
  document.getElementById('tabReport').textContent = t('tabReport');
  document.getElementById('tabMine').textContent = t('tabMine');
  document.getElementById('tabAdmin').textContent = t('tabAdmin');
  document.getElementById('hReport').textContent = t('hReport');
  document.getElementById('hintReport').textContent = t('hintReport');
  document.getElementById('lblRequester').textContent = t('lblRequester');
  document.getElementById('requesterAutofield').textContent = `🔒 ${session.name || session.email} — ${session.email}`;
  document.getElementById('lblCategory').textContent = t('lblCategory');
  document.getElementById('lblDetails').textContent = t('lblDetails');
  document.getElementById('lblPhoto').textContent = t('lblPhoto');
  document.getElementById('hintPhoto').textContent = t('hintPhoto');
  document.getElementById('lblRemote').textContent = t('lblRemote');
  document.getElementById('submitTicketBtn').textContent = t('submitTicketBtn');
  document.getElementById('hMine').textContent = t('hMine');
  document.getElementById('subtabOpen').textContent = t('subtabOpen');
  document.getElementById('subtabProgress').textContent = t('subtabProgress');
  document.getElementById('subtabResolved').textContent = t('subtabResolved');

  const catSel = document.getElementById('fCategory');
  const prevCat = catSel.value;
  catSel.innerHTML = `<option value="">${t('categoryPh')}</option>` + CATEGORY_KEYS.map(k=>`<option value="${k}">${t('cat_'+k)}</option>`).join('');
  if (prevCat && CATEGORY_KEYS.includes(prevCat)) catSel.value = prevCat;
  const remSel = document.getElementById('fRemote');
  remSel.innerHTML = `<option value="">${t('remoteNone')}</option>` + REMOTE_KEYS.map(k=>`<option value="${k}">${t('rem_'+k)}</option>`).join('');
  updateSubmitBtnState();
}

document.getElementById('langBtn').addEventListener('click', ()=>{
  curLang = curLang === 'en' ? 'es' : 'en';
  document.getElementById('langBtn').textContent = curLang === 'en' ? 'ES' : 'EN';
  applyStaticText();
  loadMyTickets();
  if (isItAdmin) loadAdminTickets();
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem('acm_gsession');
  if (typeof google !== 'undefined' && google.accounts) { try { google.accounts.id.disableAutoSelect(); } catch(e){} }
  window.location.href = '../login.html';
});

document.querySelectorAll('.ev-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.ev-tab').forEach(x=>x.classList.remove('on'));
    tab.classList.add('on');
    ['report','mine','admin'].forEach(k=>{
      document.getElementById('p-'+k).hidden = (k !== tab.dataset.t);
    });
    if (tab.dataset.t === 'mine') loadMyTickets();
    if (tab.dataset.t === 'admin' && isItAdmin) loadAdminTickets();
  });
});

document.querySelectorAll('#adminSubtabs .ev-subtab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('#adminSubtabs .ev-subtab').forEach(x=>x.classList.remove('on'));
    tab.classList.add('on');
    adminStatus = tab.dataset.st;
    loadAdminTickets();
  });
});

// ---------------- Report a problem ----------------
let uploadedTicketId = null;
let ticketSubmitting = false;

// El boton empieza (y vuelve a quedar) gris/deshabilitado mientras falten
// los campos obligatorios (categoria + detalles) - pedido de Jesus para
// que no se puedan mandar tickets en blanco. Tambien se deshabilita
// mientras un envio esta en curso, para que un doble clic no cree dos
// tickets duplicados.
function ticketFormIsValid(){
  const category = document.getElementById('fCategory').value;
  const details = document.getElementById('fDetails').value.trim();
  return Boolean(category && details);
}
function updateSubmitBtnState(){
  document.getElementById('submitTicketBtn').disabled = ticketSubmitting || !ticketFormIsValid();
}
document.getElementById('fCategory').addEventListener('change', updateSubmitBtnState);
document.getElementById('fDetails').addEventListener('input', updateSubmitBtnState);

function resetTicketForm(){
  document.getElementById('fCategory').selectedIndex = 0;
  document.getElementById('fDetails').value = '';
  document.getElementById('fPhoto').value = '';
  document.getElementById('fRemote').selectedIndex = 0;
}

document.getElementById('submitTicketBtn').addEventListener('click', async ()=>{
  if (ticketSubmitting || !ticketFormIsValid()) return; // ya deberia estar deshabilitado, doble seguro
  const category = document.getElementById('fCategory').value;
  const details = document.getElementById('fDetails').value.trim();
  const remote = document.getElementById('fRemote').value;
  const photoFile = document.getElementById('fPhoto').files[0];
  const errEl = document.getElementById('ticketError');
  const okEl = document.getElementById('ticketSuccess');
  errEl.style.display = 'none'; okEl.style.display = 'none';

  ticketSubmitting = true;
  updateSubmitBtnState();
  try {
    const r = await apiJson(API_BASE, '/it-tickets', {
      method: 'POST',
      body: JSON.stringify({ category, details, remote_connection: remote || null }),
    });
    if (photoFile) {
      const fd = new FormData();
      fd.append('file', photoFile);
      try { await apiJson(API_BASE, `/it-tickets/${r.id}/photo`, { method: 'POST', body: fd }); }
      catch (e) { /* la foto es opcional - el ticket ya se creo, no bloquear al agente por esto */ }
    }
    okEl.textContent = t('ticketSuccess')(r.case_number);
    okEl.style.display = 'block';
    resetTicketForm(); // formulario en blanco tras enviar - pedido de Jesus
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    ticketSubmitting = false;
    updateSubmitBtnState(); // si el form quedo en blanco, el boton vuelve a gris solo
  }
});

// ---------------- My Tickets ----------------
async function loadMyTickets(){
  const data = await apiJson(API_BASE, '/it-tickets/mine');
  const wrap = document.getElementById('myTickets');
  if (!data.tickets.length) { wrap.innerHTML = `<p class="ev-hint">${t('noMine')}</p>`; return; }
  wrap.innerHTML = data.tickets.map(tk => ticketCardHTML(tk, false)).join('');
  wireThreadToggles(wrap);
}

// ---------------- Admin ----------------
async function loadAdminTickets(){
  const data = await apiJson(API_BASE, `/it-tickets/admin/all?status=${adminStatus}`);
  const wrap = document.getElementById('adminTickets');
  if (!data.tickets.length) { wrap.innerHTML = `<p class="ev-hint">${t('noTickets')}</p>`; return; }
  wrap.innerHTML = data.tickets.map(tk => ticketCardHTML(tk, true)).join('');
  wireThreadToggles(wrap);

  wrap.querySelectorAll('[data-take]').forEach(btn=>btn.addEventListener('click', async ()=>{
    btn.disabled = true;
    try {
      await apiJson(API_BASE, `/it-tickets/admin/${btn.dataset.take}/assign`, {
        method: 'POST',
        body: JSON.stringify({ assigned_to_email: session.email, assigned_to_name: session.name || session.email }),
      });
      loadAdminTickets();
    } catch (e) { alert(e.message); btn.disabled = false; }
  }));

  wrap.querySelectorAll('[data-reply-btn]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const id = btn.dataset.replyBtn;
    const card = wrap.querySelector(`[data-card="${id}"]`);
    const msgEl = card.querySelector('[data-reply-msg]');
    const resEl = card.querySelector('[data-reply-resolution]');
    const emailEl = card.querySelector('[data-reply-email]');
    const message = msgEl.value.trim();
    if (!message) { alert(t('replyMissing')); return; }
    btn.disabled = true;
    try {
      await apiJson(API_BASE, `/it-tickets/admin/${id}/update`, {
        method: 'POST',
        body: JSON.stringify({ message, is_resolution: resEl.checked, send_email: emailEl.checked }),
      });
      loadAdminTickets();
    } catch (e) { alert(e.message); btn.disabled = false; }
  }));
}

function wireThreadToggles(wrap){
  wrap.querySelectorAll('[data-toggle-thread]').forEach(btn=>btn.addEventListener('click', ()=>{
    const thread = wrap.querySelector(`[data-thread="${btn.dataset.toggleThread}"]`);
    thread.style.display = thread.style.display === 'none' ? 'block' : 'none';
  }));
}

function fmtDate(iso){
  try { return new Date(iso).toLocaleString(); } catch(e) { return iso; }
}

function ticketCardHTML(tk, isAdminView){
  const badgeClass = `badge-${tk.status}`;
  const badgeText = tk.status === 'open' ? t('statusOpen') : (tk.status === 'in_progress' ? t('statusInProgress') : t('statusResolved'));
  const assignedLine = tk.assigned_to_name ? t('assignedTo')(tk.assigned_to_name) : t('unassigned');
  const requesterLine = isAdminView ? `${tk.requester_name} (${tk.requester_email}) · ` : '';
  const photoLine = tk.photo_drive_url ? `<div class="tk-photo"><a href="${tk.photo_drive_url}" target="_blank" rel="noopener">📎 ${t('viewPhoto')}</a></div>` : '';
  const takeBtn = (isAdminView && !tk.assigned_to_email) ? `<button class="btn-sec" data-take="${tk.id}" style="margin-top:10px">${t('takeTicket')}</button>` : '';
  const replyBox = isAdminView ? `
    <div class="reply-box">
      <label class="frm-lbl">${t('replyLbl')}</label>
      <textarea data-reply-msg placeholder="${t('replyPh')}"></textarea>
      <label class="chk"><input type="checkbox" data-reply-resolution> ${t('isResolution')}</label>
      <label class="chk"><input type="checkbox" data-reply-email checked> ${t('sendEmailNow')}</label>
      <button class="btn-primary" data-reply-btn="${tk.id}">${t('sendReplyBtn')}</button>
    </div>` : '';
  return `<div class="event-card" data-card="${tk.id}">
    <div class="tk-top">
      <div><div class="tk-cat">${t('cat_'+tk.category)}</div>
        <div class="tk-meta">${requesterLine}${tk.case_number} · ${fmtDate(tk.created_at)} · ${assignedLine}</div>
      </div>
      <span class="badge ${badgeClass}">${badgeText}</span>
    </div>
    <div class="tk-detail">${tk.details}</div>
    ${photoLine}
    ${takeBtn}
    <button class="btn-sec" data-toggle-thread="${tk.id}" style="margin-top:10px">${t('threadHeader')}</button>
    <div class="thread" data-thread="${tk.id}" style="display:none"></div>
    ${replyBox}
  </div>`;
}

// El hilo de respuestas se carga on-demand (al abrir "Historial") en vez de
// con cada ticket de la lista, para no disparar N llamadas extra en cada
// carga de la pestana - igual de responsivo, menos llamadas a la API.
document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-toggle-thread]');
  if (!btn) return;
  const threadEl = document.querySelector(`.thread[data-thread="${btn.dataset.toggleThread}"]`);
  if (!threadEl || threadEl.dataset.loaded) return;
  threadEl.dataset.loaded = '1';
  try {
    const data = await apiJson(API_BASE, `/it-tickets/${btn.dataset.toggleThread}`);
    threadEl.innerHTML = data.updates.length
      ? data.updates.map(u => `<div class="thread-item${u.is_resolution ? ' resolution' : ''}"><b>${u.author_name}</b> — ${fmtDate(u.created_at)}<br>${u.message}</div>`).join('')
      : `<p class="ev-hint" style="margin:0">—</p>`;
  } catch (e) { threadEl.innerHTML = `<p class="ev-hint" style="margin:0">${e.message}</p>`; }
});

async function init(){
  applyStaticText();
  if (!apiReady()) {
    document.getElementById('apiBanner').classList.add('show');
    document.getElementById('apiBanner').textContent = t('apiPending');
    return;
  }
  try { await loadMyTickets(); }
  catch(e) {
    document.getElementById('apiBanner').classList.add('show');
    document.getElementById('apiBanner').textContent = e.message;
  }
  // Mismo truco que events.html: no hay endpoint "soy admin?" dedicado,
  // se prueba una llamada admin-only y si no tira 403 se muestra la
  // pestana (ver require_it_admin en api/auth.py).
  try {
    await apiJson(API_BASE, '/it-tickets/admin/all?status=open');
    isItAdmin = true;
    document.getElementById('tabAdmin').style.display = 'block';
  } catch (e) { /* not an IT admin - tab stays hidden */ }
}
init();
</script>
