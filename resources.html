<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Resources — Allcare Mar Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --blue:#1a2fd4; --blue-dark:#0f1e9a; --blue-light:#e8ecff;
  --red:#e8001d; --red-dark:#b50016; --red-light:#fff0f2;
  --gray-50:#faf8f5; --gray-200:#e6e0d6; --gray-400:#8b8377; --gray-600:#544f47; --gray-800:#2b2723;
  --r:12px; --r-lg:20px; --r-xl:28px;
  --sh:0 4px 24px rgba(58,53,48,.08); --sh-lg:0 16px 56px rgba(58,53,48,.14);
  --t:.25s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px;overflow-x:hidden}
body{font-family:'Open Sans',sans-serif;color:var(--gray-800);background:var(--gray-50);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
h1,h2,h3{font-family:'Montserrat',sans-serif;line-height:1.2}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

.auth-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 5vw;background:#fff;border-bottom:1px solid var(--gray-200)}
.auth-logo img{height:38px;width:auto}
.auth-nav-right{display:flex;align-items:center;gap:14px}
.back-link{display:flex;align-items:center;gap:6px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:var(--blue-dark)}
.back-link:hover{color:var(--blue)}
.lang-toggle{background:var(--blue-light);color:var(--blue-dark);border:none;border-radius:20px;padding:7px 16px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer;letter-spacing:.03em}
.lang-toggle:hover{background:var(--blue);color:#fff}

.wrap{flex:1;padding:44px 5vw 60px;max-width:980px;margin:0 auto;width:100%}
.page-title{font-size:24px;font-weight:800;color:var(--blue-dark);margin-bottom:6px}
.page-sub{font-size:13.5px;color:var(--gray-600);margin-bottom:36px}

.res-section{margin-bottom:40px}
.res-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.res-head .si{width:40px;height:40px;border-radius:12px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.res-head.red .si{background:var(--red-light);color:var(--red)}
.res-head h2{font-size:17px;font-weight:800;color:var(--gray-800)}
.res-head p{font-size:12px;color:var(--gray-600);margin-top:2px}

.res-list{display:flex;flex-direction:column;gap:10px}
.res-item{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r);padding:14px 16px;transition:var(--t)}
.res-item:hover{border-color:var(--blue);transform:translateX(2px);box-shadow:var(--sh)}
.res-item .ri{width:38px;height:38px;border-radius:10px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.res-item.red .ri{background:var(--red-light);color:var(--red)}
.res-item .rt{flex:1}
.res-item .rn{font-family:'Montserrat',sans-serif;font-weight:800;font-size:13.5px;color:var(--gray-800)}
.res-item .rd{font-size:12px;color:var(--gray-600);margin-top:2px}
.res-item .arrow{color:var(--gray-400);font-size:14px}
.res-empty{font-size:12.5px;color:var(--gray-400);padding:16px;text-align:center;border:1.5px dashed var(--gray-200);border-radius:var(--r)}

.auth-mini-footer{padding:22px 20px;text-align:center;font-size:11.5px;color:var(--gray-400);background:#fff;border-top:1px solid var(--gray-200)}
.auth-mini-footer a{color:var(--gray-600);font-weight:700;margin-left:6px}

@media(max-width:480px){.wrap{padding:32px 5vw 50px}}
</style>
</head>
<body>
<nav class="auth-nav">
  <a href="index.html" class="auth-logo"><img src="assets/img/logo-allcaremar.png" alt="Allcare Mar Insurance Agents"/></a>
  <div class="auth-nav-right">
    <a href="dashboard-agentes.html" class="back-link"><i class="fas fa-arrow-left"></i> <span id="backLabel"></span></a>
    <button class="lang-toggle" id="langBtn"><span id="lang-label">ES</span></button>
  </div>
</nav>

<main class="wrap">
  <div class="page-title" id="pageTitle"></div>
  <div class="page-sub" id="pageSub"></div>

  <div class="res-section">
    <div class="res-head">
      <div class="si"><i class="fas fa-video"></i></div>
      <div>
        <h2 id="sec1Title"></h2>
        <p id="sec1Sub"></p>
      </div>
    </div>
    <div class="res-list" id="trainingList"></div>
  </div>

  <div class="res-section">
    <div class="res-head red">
      <div class="si"><i class="fas fa-file-lines"></i></div>
      <div>
        <h2 id="sec2Title"></h2>
        <p id="sec2Sub"></p>
      </div>
    </div>
    <div class="res-list" id="docsList"></div>
  </div>
</main>

<footer class="auth-mini-footer">
  <span id="mini-copy"></span><a href="privacy-security-policy.pdf" target="_blank" rel="noopener" id="mini-priv"></a>
</footer>

<script type="module">
import { isEmailAllowed } from "./google-config.js";

let curLang='en';

// ============================================================================
// Contenido de Resources — agregar un objeto nuevo a cualquiera de las dos
// listas para que aparezca automáticamente aquí. type:'zoom' usa el ícono de
// cámara, type:'doc' usa el ícono de documento (solo visual, no cambia nada
// más). "desc" es opcional (una línea de contexto debajo del nombre).
// ============================================================================
const TRAINING = [
  // { href:'https://zoom.us/rec/share/XXXXXXXX', en:'New Agent Onboarding — Recording', es:'Inducción de Nuevos Agentes — Grabación', desc_en:'Recorded Oct 2026', desc_es:'Grabado Oct 2026' },
];

const DOCS = [
  // { href:'https://drive.google.com/...', en:'Medicare Advantage Quick Reference', es:'Referencia Rápida de Medicare Advantage' },
];

const I18N = {
  en:{ back:'Back to Dashboard', pageTitle:'Resources', pageSub:'Training Zoom links and support documents for Allcare Mar agents.',
    sec1Title:'Training Videos', sec1Sub:'Zoom recordings and live session links.',
    sec2Title:'Support Materials', sec2Sub:'Reference documents and guides.',
    empty:'Nothing posted yet — check back soon.' },
  es:{ back:'Volver al Panel', pageTitle:'Recursos', pageSub:'Links de Zoom de capacitación y documentos de apoyo para agentes de Allcare Mar.',
    sec1Title:'Videos de Capacitación', sec1Sub:'Grabaciones de Zoom y links de sesiones en vivo.',
    sec2Title:'Materiales de Apoyo', sec2Sub:'Documentos de referencia y guías.',
    empty:'Todavía no hay nada publicado — vuelve pronto.' }
};

function label(x){ return curLang==='es' ? x.es : x.en; }
function desc(x){ return curLang==='es' ? (x.desc_es||'') : (x.desc_en||''); }

function renderList(list, elId, iconClass, redVariant){
  const t = I18N[curLang];
  const el = document.getElementById(elId);
  if(!list.length){ el.innerHTML = '<div class="res-empty">'+t.empty+'</div>'; return; }
  el.innerHTML = list.map(x=>{
    const d = desc(x);
    return '<a class="res-item'+(redVariant?' red':'')+'" href="'+x.href+'" target="_blank" rel="noopener">'
      + '<div class="ri"><i class="fas '+iconClass+'"></i></div>'
      + '<div class="rt"><div class="rn">'+label(x)+'</div>'+(d?'<div class="rd">'+d+'</div>':'')+'</div>'
      + '<i class="fas fa-arrow-up-right-from-square arrow"></i></a>';
  }).join('');
}

function applyLang(){
  const t = I18N[curLang];
  document.documentElement.lang = curLang; document.documentElement.setAttribute('data-lang',curLang);
  document.getElementById('lang-label').textContent = curLang==='en' ? 'ES' : 'EN';
  document.getElementById('backLabel').textContent = t.back;
  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('pageSub').textContent = t.pageSub;
  document.getElementById('sec1Title').textContent = t.sec1Title;
  document.getElementById('sec1Sub').textContent = t.sec1Sub;
  document.getElementById('sec2Title').textContent = t.sec2Title;
  document.getElementById('sec2Sub').textContent = t.sec2Sub;
  renderList(TRAINING, 'trainingList', 'fa-video', false);
  renderList(DOCS, 'docsList', 'fa-file-arrow-down', true);
  applyMiniFooter();
}
function toggleLang(){ curLang = curLang==='en'?'es':'en'; applyLang(); }
document.getElementById('langBtn').addEventListener('click', toggleLang);

function applyMiniFooter(){
  document.getElementById('mini-copy').textContent = curLang==='en' ? '© 2026 Allcare Mar Insurance Agents. All Rights Reserved.' : '© 2026 Allcare Mar Insurance Agents. Todos los derechos reservados.';
  document.getElementById('mini-priv').textContent = curLang==='en' ? 'Privacy & Security Policy (PDF)' : 'Politica de Privacidad y Seguridad (PDF)';
}

// Mismo guard de sesión que dashboard-agentes.html — esta página también es
// intranet privada, no debe verse sin login válido.
(function guard(){
  const raw = localStorage.getItem('acm_gsession');
  if(!raw){ window.location.href='login.html'; return; }
  let session;
  try{ session = JSON.parse(raw); }catch(e){ localStorage.removeItem('acm_gsession'); window.location.href='login.html'; return; }
  if(!isEmailAllowed(session.email) || !session.localExp || Date.now() > session.localExp){
    localStorage.removeItem('acm_gsession');
    window.location.href='login.html';
    return;
  }
})();
applyLang();
</script>
</body>
</html>
